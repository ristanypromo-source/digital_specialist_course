/* ===================== storage ===================== */
const KEY = "ppctrack.v1";
const blank = () => ({v:1, lessons:{}, exams:{}, theme:"auto", unlockAll:false});
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    const o = JSON.parse(raw);
    return Object.assign(blank(), o);
  }catch(e){ return blank(); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast("Браузер не дал сохранить прогресс. Проверь режим инкогнито."); }
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", S.theme || "auto");
}

/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
const allLessons = () => COURSE.modules.flatMap(m => m.lessons.map(l => ({m, l})));
const lessonDone = id => !!(S.lessons[id] && S.lessons[id].done);
const examPassed = id => !!(S.exams[id] && S.exams[id].passed);

function moduleUnlocked(i){
  if(S.unlockAll) return true;
  if(i === 0) return true;
  return examPassed(COURSE.modules[i-1].id);
}
function moduleProgress(m){
  const total = m.lessons.length + 1;
  let done = m.lessons.filter(l => lessonDone(l.id)).length;
  if(examPassed(m.id)) done++;
  return {done, total, pct: Math.round(done/total*100)};
}
function overallPct(){
  let t=0, d=0;
  COURSE.modules.forEach(m => { const p = moduleProgress(m); t += p.total; d += p.done; });
  return t ? Math.round(d/t*100) : 0;
}

/* ===================== router ===================== */
let view = {name:"home"};
function go(v){ view = v; window.scrollTo(0,0); render(); }

function render(){
  applyTheme();
  renderRail();
  const M = $("#main");
  if(view.name === "home") M.innerHTML = viewHome();
  else if(view.name === "glossary") M.innerHTML = viewGlossary();
  else if(view.name === "progress") M.innerHTML = viewProgress();
  else if(view.name === "module") M.innerHTML = viewModule(view.m);
  else if(view.name === "lesson") M.innerHTML = viewLesson(view.m, view.l);
  else if(view.name === "quiz") { renderQuiz(); return; }
  bind();
}

function renderRail(){
  const pct = overallPct();
  $("#gauge").style.width = pct + "%";
  $("#gaugeTxt").textContent = pct + "% пройдено";
  document.querySelectorAll("button[data-nav]").forEach(b => {
    b.setAttribute("aria-current", view.name === b.dataset.nav ? "true" : "false");
  });
  $("#modlist").innerHTML = COURSE.modules.map((m,i) => {
    const unlocked = moduleUnlocked(i);
    const p = moduleProgress(m);
    const done = p.done === p.total;
    const active = !done && unlocked && p.done > 0;
    const cur = (view.name==="module"||view.name==="lesson"||view.name==="quiz") && view.m===i;
    return `<button class="modrow ${done?"done":""} ${active?"active":""}" data-mod="${i}" ${unlocked?"":"disabled"} aria-current="${cur}">
      <span class="mn">${done ? "&#10003;" : (unlocked ? "M"+m.num : "&#9679;")}</span>
      <span class="mt">${esc(m.title)}</span>
      <span class="mp">${unlocked ? p.done+"/"+p.total : ""}</span>
    </button>`;
  }).join("");
}

/* ===================== views ===================== */
function viewHome(){
  const pct = overallPct();
  const lessonsDone = allLessons().filter(x => lessonDone(x.l.id)).length;
  const qTotal = COURSE.modules.reduce((a,m)=>a+m.lessons.reduce((b,l)=>b+l.quiz.length,0)+m.exam.length,0);
  const next = nextThing();
  return `
  <h1>Карта курса</h1>
  <p class="lead">Путь от «умею запускать рекламу в Facebook» до собеседования на junior PPC. Термины даются на английском — так они выглядят в рабочих интерфейсах. Модуль открывается после сдачи экзамена предыдущего.</p>
  <div class="stats">
    <div class="stat"><div class="v">${pct}%</div><div class="l">пройдено</div></div>
    <div class="stat"><div class="v">${lessonsDone}<span style="color:var(--ink3);font-size:16px">/${allLessons().length}</span></div><div class="l">уроков</div></div>
    <div class="stat"><div class="v">${COURSE.modules.filter(m=>examPassed(m.id)).length}<span style="color:var(--ink3);font-size:16px">/${COURSE.modules.length}</span></div><div class="l">экзаменов сдано</div></div>
    <div class="stat"><div class="v">${qTotal}</div><div class="l">вопросов в базе</div></div>
  </div>
  ${next ? `<div class="row" style="margin:22px 0 6px"><button class="btn" data-open="${next.href}">${esc(next.label)}</button><span style="font-size:14px;color:var(--ink2)">${esc(next.sub)}</span></div>` : `<p style="margin-top:22px"><span class="badge ok">Все доступные модули пройдены</span></p>`}
  <div class="sep"></div>
  <h2>Модули</h2>
  <div class="lessonlist">
  ${COURSE.modules.map((m,i)=>{
    const u = moduleUnlocked(i); const p = moduleProgress(m);
    return `<button class="lrow ${p.done===p.total?"done":""}" data-mod="${i}" ${u?"":"disabled"} style="${u?"":"opacity:.45;cursor:not-allowed"}">
      <span class="lm">${p.done===p.total?"&#10003;":"M"+m.num}</span>
      <span><span class="lt">${esc(m.title)}</span><span class="ls">${esc(m.subtitle)} · ${esc(m.duration)}</span></span>
      <span class="lsc">${u ? p.done+"/"+p.total : "закрыт"}</span>
    </button>`;
  }).join("")}
  </div>
  <p style="font-size:13.5px;color:var(--ink3);max-width:70ch">Дальше в производстве: M8 AI в ежедневной работе, M9 отчётность, дашборды и Excel, M10 трудоустройство и портфолио.</p>`;
}

function nextThing(){
  for(let i=0;i<COURSE.modules.length;i++){
    if(!moduleUnlocked(i)) break;
    const m = COURSE.modules[i];
    const l = m.lessons.find(x => !lessonDone(x.id));
    if(l) return {href:`lesson:${i}:${m.lessons.indexOf(l)}`, label:"Продолжить", sub:`M${m.num} · ${l.title}`};
    if(!examPassed(m.id)) return {href:`exam:${i}`, label:"Сдать экзамен модуля", sub:`M${m.num} · ${m.title}`};
  }
  return null;
}

function viewModule(mi){
  const m = COURSE.modules[mi];
  const p = moduleProgress(m);
  const allL = m.lessons.every(l => lessonDone(l.id));
  const ex = S.exams[m.id];
  return `
  <div class="crumb">Модуль ${m.num} · ${esc(m.duration)}</div>
  <h1>${esc(m.title)}</h1>
  <p class="lead">${esc(m.intro)}</p>
  <div class="gauge" style="max-width:320px;margin:20px 0 6px"><i style="width:${p.pct}%"></i></div>
  <div class="mono" style="font-size:12.5px;color:var(--ink3)">${p.done} из ${p.total}</div>
  <h2>Уроки</h2>
  <div class="lessonlist">
  ${m.lessons.map((l,li)=>{
    const d = lessonDone(l.id); const r = S.lessons[l.id];
    return `<button class="lrow ${d?"done":""}" data-open="lesson:${mi}:${li}">
      <span class="lm">${d?"&#10003;":li+1}</span>
      <span><span class="lt">${esc(l.title)}</span><span class="ls">${l.quiz.length} вопрос${plural(l.quiz.length)}</span></span>
      <span class="lsc">${r&&r.score!=null?r.score+"/"+r.total:""}</span>
    </button>`;
  }).join("")}
  </div>
  <h2>Экзамен модуля</h2>
  <p>${m.exam.length} вопрос${plural(m.exam.length)} вперемешку по всем урокам. Проходной балл — ${m.pass}%. Экзамен открывается после всех уроков; пересдавать можно сколько угодно.</p>
  ${ex ? `<p><span class="badge ${ex.passed?"ok":""}">${ex.passed?"Сдан":"Не сдан"} · ${ex.score}/${ex.total} (${Math.round(ex.score/ex.total*100)}%)</span></p>` : ""}
  <div class="row" style="margin-top:14px">
    <button class="btn" data-open="exam:${mi}" ${allL?"":"disabled"}>${ex?"Пересдать экзамен":"Начать экзамен"}</button>
    ${allL?"":`<span style="font-size:14px;color:var(--ink2)">Сначала пройди все уроки модуля</span>`}
  </div>`;
}

function plural(n){
  const a = n%10, b = n%100;
  if(a===1 && b!==11) return "";
  if(a>=2 && a<=4 && (b<12||b>14)) return "а";
  return "ов";
}

function viewLesson(mi, li){
  const m = COURSE.modules[mi], l = m.lessons[li];
  return `
  <div class="crumb">M${m.num} · урок ${li+1} из ${m.lessons.length}</div>
  <h1>${esc(l.title)}</h1>
  ${l.blocks.map(renderBlock).join("")}
  <div class="sep"></div>
  <div class="row">
    <button class="btn" data-open="quiz:${mi}:${li}">Перейти к вопросам (${l.quiz.length})</button>
    <button class="btn ghost" data-open="module:${mi}">К модулю</button>
  </div>`;
}

function renderBlock(b){
  if(b.t==="p") return `<p>${b.x}</p>`;
  if(b.t==="h") return `<h2>${esc(b.x)}</h2>`;
  if(b.t==="term") return `<div class="term"><b>${esc(b.en)}</b> <span class="ru">— ${esc(b.ru)}</span><p>${b.d}</p></div>`;
  if(b.t==="f") return `<div class="formula">${esc(b.x)}${b.note?`<div class="note">${b.note}</div>`:""}</div>`;
  if(b.t==="ex") return `<div class="ex"><h4>${esc(b.title)}</h4>${b.body.map(x=>`<p>${x}</p>`).join("")}</div>`;
  if(b.t==="warn") return `<div class="warn"><p>${b.x}</p></div>`;
  if(b.t==="ul") return `<ul class="blist">${b.items.map(i=>`<li>${i}</li>`).join("")}</ul>`;
  if(b.t==="steps") return `<div class="stepsbox"><h4>${esc(b.title||"Как это делается")}</h4><ol class="steps">${b.items.map(i=>`<li>${i}</li>`).join("")}</ol></div>`;
  if(b.t==="path") return `<span class="path"><span class="pl">${esc(b.label||"Путь в интерфейсе")}</span>${b.x}</span>`;
  if(b.t==="tab") return `<div class="wrapscroll"><table class="btab"><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return "";
}

/* ===================== quiz engine ===================== */
let Q = null;
function startQuiz(mi, li, isExam){
  const m = COURSE.modules[mi];
  const items = isExam ? shuffle(m.exam.slice()) : m.lessons[li].quiz.slice();
  Q = {mi, li, isExam, items, i:0, correct:0, picked:[], checked:false, hintShown:false, results:[]};
  view = {name:"quiz", m:mi, l:li};
  window.scrollTo(0,0);
  renderQuiz();
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function renderQuiz(){
  renderRail();
  if(Q.i >= Q.items.length) return renderQuizEnd();
  const q = Q.items[Q.i];
  const m = COURSE.modules[Q.mi];
  const pct = Math.round(Q.i / Q.items.length * 100);
  const tagmap = {single:"один ответ", multi:"несколько ответов", tf:"верно или нет", num:"расчёт"};
  let body = "";
  if(q.type==="num"){
    body = `<div class="numwrap"><input class="numin" id="numin" type="text" inputmode="decimal" placeholder="0" ${Q.checked?"disabled":""} value="${Q.picked[0]!=null?Q.picked[0]:""}"><span class="unit">${esc(q.unit||"")}</span></div>`;
    if(Q.checked){
      const ok = Q.results[Q.results.length-1].ok;
      body += `<div class="verdict ${ok?"good":"bad"}"><b>${ok?"Верно":"Неверно. Правильный ответ: "+q.answer+" "+(q.unit||"")}</b>${q.explain}</div>`;
    }
  } else {
    const opts = q.type==="tf" ? [{t:"Верно"},{t:"Неверно"}] : q.options;
    body = `<div class="opts">` + opts.map((o,oi)=>{
      const sel = Q.picked.includes(oi);
      let cls = "", why = "";
      if(Q.checked){
        const isRight = q.type==="tf" ? (oi===0)===q.answer : !!o.ok;
        if(isRight) cls = "right";
        else if(sel) cls = "wrong";
        if(o.why && (sel || isRight)) why = `<span class="why">${o.why}</span>`;
      }
      const mk = q.type==="multi" ? (sel?"&#10003;":"") : String.fromCharCode(65+oi);
      return `<button class="opt ${q.type==="multi"?"multi":""} ${cls}" data-opt="${oi}" aria-pressed="${sel}" ${Q.checked?"disabled":""}>
        <span class="mk">${mk}</span><span>${o.t}${why}</span></button>`;
    }).join("") + `</div>`;
    if(Q.checked){
      const ok = Q.results[Q.results.length-1].ok;
      body += `<div class="verdict ${ok?"good":"bad"}"><b>${ok?"Верно":"Неверно"}</b>${q.explain}</div>`;
    }
  }
  let hint = "";
  if(!Q.isExam && q.hint && !Q.checked){
    hint = Q.hintShown
      ? `<div class="hintbox">${q.hint}</div>`
      : `<div class="row" style="margin-bottom:14px"><button class="btn ghost sm" id="hintbtn">Показать подсказку</button></div>`;
  }

  $("#main").innerHTML = `
  <div class="crumb">${Q.isExam ? "M"+m.num+" · экзамен модуля" : "M"+m.num+" · урок "+(Q.li+1)+" · вопросы"}</div>
  <div class="qcard">
    <div class="qtop"><span class="qcount">${Q.i+1} / ${Q.items.length}</span><span class="qbar"><i style="width:${pct}%"></i></span><span class="qcount">верно: ${Q.correct}</span></div>
    <span class="qtag">${tagmap[q.type]}</span>
    ${q.given ? `<div class="given"><b>Условие задачи</b>${q.given}</div>` : ""}
    <p class="qtext">${q.q}</p>
    ${hint}
    ${body}
    <div class="row">
      ${Q.checked
        ? `<button class="btn" id="nextq">${Q.i+1===Q.items.length?"Завершить":"Следующий вопрос"}</button>`
        : `<button class="btn" id="checkq" ${Q.picked.length||q.type==="num"?"":"disabled"}>Проверить</button>`}
      <button class="btn ghost" data-open="${Q.isExam?`module:${Q.mi}`:`lesson:${Q.mi}:${Q.li}`}">Выйти</button>
    </div>
  </div>`;
  bindQuiz();
}

function bindQuiz(){
  document.querySelectorAll("button[data-opt]").forEach(b=>{
    b.onclick = () => {
      const q = Q.items[Q.i], oi = +b.dataset.opt;
      if(q.type==="multi"){
        const k = Q.picked.indexOf(oi);
        k>=0 ? Q.picked.splice(k,1) : Q.picked.push(oi);
      } else Q.picked = [oi];
      renderQuiz();
    };
  });
  const hb = $("#hintbtn");
  if(hb) hb.onclick = () => { Q.hintShown = true; renderQuiz(); };
  const ni = $("#numin");
  if(ni){
    ni.oninput = () => { Q.picked = [ni.value]; };
    ni.onkeydown = e => { if(e.key==="Enter" && !Q.checked) checkQ(); };
  }
  const cb = $("#checkq"); if(cb) cb.onclick = checkQ;
  const nb = $("#nextq"); if(nb) nb.onclick = () => { Q.i++; Q.picked=[]; Q.checked=false; Q.hintShown=false; renderQuiz(); };
  document.querySelectorAll("button[data-open]").forEach(b => b.onclick = () => open(b.dataset.open));
}

function checkQ(){
  const q = Q.items[Q.i];
  let ok = false;
  if(q.type==="num"){
    const live = $("#numin");
    const raw = live ? live.value : (Q.picked[0] || "");
    Q.picked = [raw];
    const v = parseFloat(String(raw).replace(",",".").replace(/[^\d.\-]/g,""));
    ok = !isNaN(v) && Math.abs(v - q.answer) <= (q.tol != null ? q.tol : 0.01);
  } else if(q.type==="tf"){
    ok = Q.picked.length===1 && ((Q.picked[0]===0) === q.answer);
  } else if(q.type==="multi"){
    const right = q.options.map((o,i)=>o.ok?i:-1).filter(i=>i>=0).sort().join(",");
    ok = Q.picked.slice().sort((a,b)=>a-b).join(",") === right;
  } else {
    ok = Q.picked.length===1 && !!q.options[Q.picked[0]].ok;
  }
  if(ok) Q.correct++;
  Q.results.push({id:q.id, ok});
  Q.checked = true;
  renderQuiz();
}

function renderQuizEnd(){
  const m = COURSE.modules[Q.mi];
  const total = Q.items.length, score = Q.correct;
  const pct = Math.round(score/total*100);
  let head = "", note = "";
  if(Q.isExam){
    const passed = pct >= m.pass;
    const prev = S.exams[m.id];
    if(!prev || score > prev.score || passed) S.exams[m.id] = {score, total, passed, date: Date.now()};
    save();
    head = passed
      ? `<h1>Экзамен сдан</h1><p class="lead">${score} из ${total} — ${pct}%. Следующий модуль открыт.</p>`
      : `<h1>Экзамен не сдан</h1><p class="lead">${score} из ${total} — ${pct}%. Нужно ${m.pass}%. Вернись к урокам, где ошибся, и пересдай — попыток сколько угодно.</p>`;
  } else {
    const l = m.lessons[Q.li];
    const prev = S.lessons[l.id];
    if(!prev || score > prev.score) S.lessons[l.id] = {done:true, score, total};
    else S.lessons[l.id].done = true;
    save();
    head = `<h1>Урок пройден</h1><p class="lead">${score} из ${total} — ${pct}%.</p>`;
  }
  const wrong = Q.results.filter(r=>!r.ok);
  if(wrong.length) note = `<p style="font-size:14.5px;color:var(--ink2)">Ошибок: ${wrong.length}. Разбор каждой был сразу после ответа — если что-то осталось непонятным, перечитай урок перед экзаменом.</p>`;
  const nxt = nextThing();
  $("#main").innerHTML = `${head}
    <div class="stats"><div class="stat"><div class="v">${score}/${total}</div><div class="l">правильных</div></div>
    <div class="stat"><div class="v">${pct}%</div><div class="l">результат</div></div></div>
    ${note}
    <div class="row" style="margin-top:20px">
      <button class="btn" data-open="${Q.isExam?`module:${Q.mi}`:(nxt?nxt.href:`module:${Q.mi}`)}">${Q.isExam?"К модулю":"Дальше"}</button>
      <button class="btn ghost" data-open="${Q.isExam?`exam:${Q.mi}`:`quiz:${Q.mi}:${Q.li}`}">Пройти ещё раз</button>
      <button class="btn ghost" data-open="home">Карта курса</button>
    </div>`;
  renderRail();
  document.querySelectorAll("button[data-open]").forEach(b => b.onclick = () => open(b.dataset.open));
}

/* ===================== glossary / progress ===================== */
function collectTerms(){
  const out = [];
  COURSE.modules.forEach(m => m.lessons.forEach(l => l.blocks.forEach(b => {
    if(b.t==="term") out.push({en:b.en, ru:b.ru, d:b.d, src:`M${m.num} · ${l.title}`});
  })));
  return out.sort((a,b)=>a.en.localeCompare(b.en));
}
function viewGlossary(){
  const terms = collectTerms();
  return `<h1>Словарь терминов</h1>
  <p class="lead">${terms.length} термин${plural(terms.length)} из пройденных и будущих модулей. Ищи по английскому названию или по русскому описанию.</p>
  <input class="glosssearch" id="gsearch" placeholder="Поиск: CPL, атрибуция, match type…" autocomplete="off">
  <div id="glist">${terms.map(gitem).join("")}</div>`;
}
function gitem(t){
  return `<div class="gitem" data-k="${esc((t.en+" "+t.ru+" "+t.d).toLowerCase())}">
    <b>${esc(t.en)}</b> <span class="gr">— ${esc(t.ru)}</span><p>${t.d}</p><div class="gsrc">${esc(t.src)}</div></div>`;
}
function viewProgress(){
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  return `<h1>Прогресс и перенос</h1>
  <p class="lead">Прогресс хранится в этом браузере. Чтобы продолжить на другом компьютере, скопируй код ниже и вставь его там.</p>
  <h2>Перенести на другой компьютер</h2>
  <textarea class="codebox" id="expbox" readonly>${esc(code)}</textarea>
  <div class="row" style="margin:10px 0 24px">
    <button class="btn sm" id="copycode">Скопировать код</button>
    <button class="btn ghost sm" id="dlcode">Скачать файлом</button>
  </div>
  <h2>Загрузить прогресс</h2>
  <p>Вставь код, сохранённый на другом компьютере. Текущий прогресс будет заменён.</p>
  <textarea class="codebox" id="impbox" placeholder="Вставь код сюда"></textarea>
  <div class="row" style="margin:10px 0 24px"><button class="btn sm" id="impbtn">Загрузить прогресс</button></div>
  <div class="sep"></div>
  <h2>Настройки</h2>
  <div class="row" style="margin-bottom:14px">
    <span style="font-size:14.5px">Оформление:</span>
    ${["auto","light","dark"].map(t=>`<button class="btn ghost sm" data-settheme="${t}" style="${S.theme===t?"border-color:var(--accent);color:var(--accent)":""}">${{auto:"Как в системе",light:"Светлое",dark:"Тёмное"}[t]}</button>`).join("")}
  </div>
  <div class="row" style="margin-bottom:14px">
    <span style="font-size:14.5px">Доступ к модулям:</span>
    <button class="btn ghost sm" id="unlockbtn">${S.unlockAll?"Вернуть последовательный порядок":"Открыть все модули сразу"}</button>
  </div>
  <p style="font-size:13.5px;color:var(--ink2)">Последовательный порядок — это то, ради чего курс и сделан: экзамен не пропускается, материал не забывается. Открывай всё, только если нужно что-то быстро посмотреть.</p>
  <div class="sep"></div>
  <button class="btn ghost sm" id="resetbtn" style="border-color:var(--no);color:var(--no)">Сбросить весь прогресс</button>`;
}

/* ===================== binding ===================== */
function open(href){
  const p = href.split(":");
  if(p[0]==="home") return go({name:"home"});
  if(p[0]==="glossary") return go({name:"glossary"});
  if(p[0]==="progress") return go({name:"progress"});
  if(p[0]==="module") return go({name:"module", m:+p[1]});
  if(p[0]==="lesson") return go({name:"lesson", m:+p[1], l:+p[2]});
  if(p[0]==="quiz") return startQuiz(+p[1], +p[2], false);
  if(p[0]==="exam") return startQuiz(+p[1], null, true);
}

function bind(){
  document.querySelectorAll("button[data-open]").forEach(b => b.onclick = () => open(b.dataset.open));
  document.querySelectorAll("button[data-mod]").forEach(b => { if(!b.disabled) b.onclick = () => go({name:"module", m:+b.dataset.mod}); });

  const gs = $("#gsearch");
  if(gs) gs.oninput = () => {
    const v = gs.value.trim().toLowerCase();
    document.querySelectorAll("#glist .gitem").forEach(el => {
      el.style.display = !v || el.dataset.k.includes(v) ? "" : "none";
    });
  };
  const cc = $("#copycode");
  if(cc) cc.onclick = async () => {
    const t = $("#expbox");
    try{ await navigator.clipboard.writeText(t.value); }
    catch(e){ t.select(); document.execCommand("copy"); }
    toast("Код скопирован");
  };
  const dl = $("#dlcode");
  if(dl) dl.onclick = () => {
    const blob = new Blob([$("#expbox").value], {type:"text/plain"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ppctrack-progress.txt";
    a.click(); URL.revokeObjectURL(a.href);
  };
  const ib = $("#impbtn");
  if(ib) ib.onclick = () => {
    const raw = $("#impbox").value.trim();
    if(!raw) return toast("Вставь код");
    try{
      const o = JSON.parse(decodeURIComponent(escape(atob(raw))));
      if(!o || typeof o !== "object" || !("lessons" in o)) throw 0;
      S = Object.assign(blank(), o); save(); render();
      toast("Прогресс загружен");
    }catch(e){ toast("Код не читается. Скопируй его целиком."); }
  };
  document.querySelectorAll("button[data-settheme]").forEach(b => b.onclick = () => { S.theme = b.dataset.settheme; save(); render(); });
  const ub = $("#unlockbtn");
  if(ub) ub.onclick = () => { S.unlockAll = !S.unlockAll; save(); render(); };
  const rb = $("#resetbtn");
  if(rb) rb.onclick = () => {
    if(confirm("Сбросить весь прогресс? Это нельзя отменить.")){ S = blank(); save(); go({name:"home"}); }
  };
  document.querySelectorAll("button[data-nav]").forEach(b => b.onclick = () => go({name:b.dataset.nav}));
}

render();
</script>
</body>
</html>
