<!doctype html>
<html lang="ru" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PPC Track — курс по performance-маркетингу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F2EE; --surface:#FFFFFF; --surface2:#E8EAE4; --surface3:#DFE2DA;
  --ink:#191E1B; --ink2:#4B544F; --ink3:#7E8882;
  --line:#D2D7CE; --line2:#BDC4B9;
  --accent:#2F6F5E; --accentInk:#FFFFFF; --accentSoft:#DBE9E3;
  --term:#8A6318; --termSoft:#F4E9D2;
  --ok:#2C7A4C; --okSoft:#DCEEE1;
  --no:#A63A29; --noSoft:#F6E1DC;
  --shadow:0 1px 0 rgba(25,30,27,.06), 0 8px 24px -16px rgba(25,30,27,.35);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131817; --surface:#1A211E; --surface2:#222A27; --surface3:#2B3531;
    --ink:#E8EBE6; --ink2:#A7B1AB; --ink3:#77827C;
    --line:#2D3733; --line2:#3A4540;
    --accent:#5FA890; --accentInk:#0F1614; --accentSoft:#1D2C27;
    --term:#D6A852; --termSoft:#2A2418;
    --ok:#62B182; --okSoft:#1A2A20;
    --no:#D7705C; --noSoft:#2B1C19;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#131817; --surface:#1A211E; --surface2:#222A27; --surface3:#2B3531;
  --ink:#E8EBE6; --ink2:#A7B1AB; --ink3:#77827C;
  --line:#2D3733; --line2:#3A4540;
  --accent:#5FA890; --accentInk:#0F1614; --accentSoft:#1D2C27;
  --term:#D6A852; --termSoft:#2A2418;
  --ok:#62B182; --okSoft:#1A2A20;
  --no:#D7705C; --noSoft:#2B1C19;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Golos Text", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%;
}
code, .mono, .num{font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:288px 1fr;min-height:100vh}
.rail{
  border-right:1px solid var(--line); background:var(--surface);
  padding:20px 16px 40px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.main{padding:28px 32px 96px; max-width:820px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  .main{padding:20px 18px 80px}
}

/* ---------- rail ---------- */
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--ink3)}
.railmeta{font-size:12.5px;color:var(--ink2);margin-bottom:18px}
.gauge{height:6px;background:var(--surface3);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.gauge i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.railnav{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.navbtn{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;padding:7px 9px;border-radius:8px;font-size:14px;color:var(--ink2)
}
.navbtn:hover{background:var(--surface2)}
.navbtn[aria-current="true"]{background:var(--accentSoft);color:var(--ink);font-weight:600}
.railhead{font-size:11.5px;color:var(--ink3);margin:14px 0 7px;font-weight:600}

.modlist{display:flex;flex-direction:column;gap:3px}
.modrow{
  display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:9px;
  background:none;border:0;padding:8px 9px;border-radius:8px;text-align:left;width:100%;
}
.modrow:hover:not(:disabled){background:var(--surface2)}
.modrow:disabled{opacity:.42;cursor:not-allowed}
.modrow[aria-current="true"]{background:var(--accentSoft)}
.modrow .mn{
  font-family:"JetBrains Mono",monospace;font-size:11px;width:22px;height:22px;
  display:grid;place-items:center;border-radius:6px;border:1px solid var(--line2);color:var(--ink3)
}
.modrow.done .mn{background:var(--ok);border-color:var(--ok);color:#fff}
.modrow.active .mn{border-color:var(--accent);color:var(--accent);font-weight:700}
.modrow .mt{font-size:13.5px;line-height:1.35;color:var(--ink)}
.modrow.done .mt{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--line2)}
.modrow:disabled .mt{text-decoration:none}
.modrow .mp{font-size:11px;color:var(--ink3);font-family:"JetBrains Mono",monospace}

/* ---------- generic ---------- */
h1{font-size:30px;line-height:1.18;letter-spacing:-.022em;margin:0 0 10px;font-weight:700}
h2{font-size:21px;line-height:1.28;letter-spacing:-.015em;margin:32px 0 10px;font-weight:600}
h3{font-size:16.5px;margin:22px 0 8px;font-weight:600}
p{margin:0 0 13px;max-width:70ch}
.lead{font-size:17px;color:var(--ink2);max-width:66ch}
.crumb{font-size:12.5px;color:var(--ink3);margin-bottom:12px;font-family:"JetBrains Mono",monospace}
.btn{
  background:var(--accent);color:var(--accentInk);border:0;padding:10px 18px;
  border-radius:var(--r);font-weight:600;font-size:14.5px
}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--surface2);filter:none}
.btn.sm{padding:7px 13px;font-size:13.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sep{height:1px;background:var(--line);margin:28px 0}

/* ---------- content blocks ---------- */
.term{
  border-left:3px solid var(--term);background:var(--termSoft);
  padding:11px 14px;border-radius:0 var(--r) var(--r) 0;margin:0 0 13px
}
.term b{font-family:"JetBrains Mono",monospace;font-size:14.5px;font-weight:700;color:var(--term)}
.term .ru{font-size:14px;color:var(--ink2)}
.term p{margin:5px 0 0;font-size:14.5px}
.formula{
  background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;margin:0 0 13px;font-family:"JetBrains Mono",monospace;font-size:14.5px
}
.formula .note{font-family:"Golos Text",sans-serif;font-size:13.5px;color:var(--ink2);margin-top:6px}
.ex{border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin:0 0 13px;background:var(--surface)}
.ex h4{margin:0 0 6px;font-size:14px;font-weight:600;color:var(--accent)}
.ex p{margin:0 0 6px;font-size:14.5px}
.ex p:last-child{margin:0}
.warn{border-left:3px solid var(--no);background:var(--noSoft);padding:11px 14px;border-radius:0 var(--r) var(--r) 0;margin:0 0 13px;font-size:14.5px}
.warn p{margin:0}
ul.blist{margin:0 0 13px;padding-left:20px;max-width:70ch}
ul.blist li{margin-bottom:5px}
table.btab{border-collapse:collapse;width:100%;margin:0 0 15px;font-size:14px}
table.btab th,table.btab td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.btab th{background:var(--surface2);font-weight:600;font-size:13px}
.wrapscroll{overflow-x:auto;margin-bottom:15px}
code{background:var(--surface2);padding:1px 5px;border-radius:5px;font-size:.9em}

/* ---------- quiz ---------- */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.qcount{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--ink3)}
.qbar{height:4px;background:var(--surface3);border-radius:99px;overflow:hidden;flex:1;max-width:180px}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtext{font-size:17px;line-height:1.45;margin:0 0 16px;font-weight:500}
.qtag{display:inline-block;font-size:11px;font-family:"JetBrains Mono",monospace;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.opt{
  display:grid;grid-template-columns:22px 1fr;gap:11px;align-items:start;
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
  padding:11px 13px;text-align:left;width:100%;font-size:15px;line-height:1.45
}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .mk{
  width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);
  display:grid;place-items:center;font-size:12px;font-family:"JetBrains Mono",monospace;color:var(--ink3)
}
.opt.multi .mk{border-radius:6px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accentSoft)}
.opt[aria-pressed="true"] .mk{border-color:var(--accent);background:var(--accent);color:var(--accentInk)}
.opt.right{border-color:var(--ok);background:var(--okSoft)}
.opt.right .mk{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--noSoft)}
.opt.wrong .mk{border-color:var(--no);background:var(--no);color:#fff}
.opt .why{display:block;font-size:13.5px;color:var(--ink2);margin-top:5px}
.numin{
  font-family:"JetBrains Mono",monospace;font-size:17px;padding:10px 12px;
  border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);color:var(--ink);width:170px
}
.numwrap{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.numwrap .unit{font-family:"JetBrains Mono",monospace;color:var(--ink2);font-size:15px}
.verdict{border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:14.5px}
.verdict.good{background:var(--okSoft);border-left:3px solid var(--ok)}
.verdict.bad{background:var(--noSoft);border-left:3px solid var(--no)}
.verdict b{display:block;margin-bottom:3px}
.hintbox{font-size:14px;color:var(--ink2);background:var(--surface2);border-radius:var(--r);padding:10px 13px;margin-bottom:14px}

/* ---------- misc ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px;margin:22px 0 10px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;background:var(--surface)}
.stat .v{font-family:"JetBrains Mono",monospace;font-size:24px;font-weight:700;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--ink3);margin-top:3px}
.lessonlist{display:flex;flex-direction:column;gap:8px;margin:18px 0}
.lrow{
  display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;
  border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);
  text-align:left;width:100%
}
.lrow:hover{border-color:var(--accent)}
.lrow .lm{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;font-family:"JetBrains Mono",monospace;color:var(--ink3)}
.lrow.done .lm{background:var(--ok);border-color:var(--ok);color:#fff}
.lrow .lt{font-size:15px;font-weight:500}
.lrow .ls{font-size:12.5px;color:var(--ink3);margin-top:2px}
.lrow .lsc{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--ink3)}
.lrow.done .lt{color:var(--ink2)}
.badge{display:inline-block;font-size:11.5px;font-family:"JetBrains Mono",monospace;padding:2px 7px;border-radius:5px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.badge.ok{background:var(--okSoft);color:var(--ok);border-color:transparent}
.badge.lock{background:var(--surface2);color:var(--ink3)}
.glosssearch{width:100%;max-width:340px;padding:10px 13px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);color:var(--ink);font-size:15px;margin-bottom:18px}
.gitem{border-bottom:1px solid var(--line);padding:11px 0}
.gitem b{font-family:"JetBrains Mono",monospace;color:var(--term);font-size:15px}
.gitem .gr{color:var(--ink2);font-size:14px}
.gitem p{margin:4px 0 0;font-size:14.5px}
.gitem .gsrc{font-size:12px;color:var(--ink3);margin-top:4px}
textarea.codebox{
  width:100%;height:110px;font-family:"JetBrains Mono",monospace;font-size:12px;
  border:1px solid var(--line2);border-radius:var(--r);padding:10px;background:var(--surface2);color:var(--ink);resize:vertical
}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:99px;font-size:14px;z-index:50
}
.empty{color:var(--ink2);font-size:15px}
.steps{counter-reset:stp;margin:0 0 15px;padding:0;list-style:none;max-width:70ch}
.steps li{counter-increment:stp;position:relative;padding:0 0 12px 38px;margin:0;font-size:15px;line-height:1.55}
.steps li::before{content:counter(stp);position:absolute;left:0;top:1px;width:25px;height:25px;border-radius:50%;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700}
.steps li:last-child{padding-bottom:0}
.stepsbox{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0 0 15px;background:var(--surface)}
.stepsbox h4{margin:0 0 13px;font-size:13px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.path{display:block;font-family:"JetBrains Mono",monospace;font-size:13.5px;line-height:1.5;background:var(--surface2);border:1px dashed var(--line2);border-radius:var(--r);padding:9px 13px;margin:0 0 13px;color:var(--ink)}
.path .pl{color:var(--ink3);font-size:10.5px;display:block;margin-bottom:4px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.given{border:1px solid var(--line2);border-left:3px solid var(--ink3);background:var(--surface2);border-radius:0 var(--r) var(--r) 0;padding:11px 14px;margin:0 0 14px;font-size:14.5px;line-height:1.55}
.given b{display:block;font-size:10.5px;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px;font-weight:600}
.verbadge{font-size:10.5px;color:var(--ink3);font-family:"JetBrains Mono",monospace;margin-top:24px;padding-top:12px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><b>PPC Track</b><span class="mono">v1.4</span></div>
    <div class="railmeta">Google Ads · Meta Ads · Email</div>
    <div class="gauge"><i id="gauge" style="width:0%"></i></div>
    <div class="railmeta mono" id="gaugeTxt">0% пройдено</div>

    <div class="railnav">
      <button class="navbtn" data-nav="home">Карта курса</button>
      <button class="navbtn" data-nav="glossary">Словарь терминов</button>
      <button class="navbtn" data-nav="progress">Прогресс и перенос</button>
    </div>

    <div class="railhead">Модули</div>
    <div class="modlist" id="modlist"></div>
    <div class="verbadge">build 2026-10-17 · v1.4</div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
const COURSE = {
modules: [

/* ══════════════════ M0 ══════════════════ */
{
id:"m0", num:0, title:"Фундамент: деньги и метрики", subtitle:"Язык, на котором говорят в аккаунте", duration:"1,5 дня", pass:80,
intro:"Всё остальное в курсе стоит на этом модуле. Через все уроки проходит один сквозной кейс — компания BrightFix, ремонт бытовой техники в Чикаго. На её цифрах разбирается каждая формула, поэтому метрики не остаются абстракцией.",
lessons:[

{ id:"m0l1", title:"Что ты на самом деле покупаешь", blocks:[
{t:"p", x:"Начнём с честного описания сделки. Рекламная платформа не продаёт тебе клиентов и не продаёт продажи. Она продаёт <b>возможность показаться человеку в конкретный момент</b>. Всё, что происходит дальше — перейдёт ли он, понравится ли ему страница, купит ли он — это уже твоя зона ответственности, и платформа за это не отвечает."},
{t:"p", x:"Из этого следует главный принцип профессии: <b>плохой продукт, плохой оффер или плохая страница не чинятся рекламой</b>. Реклама умеет только увеличивать количество людей, которые их увидят. Если конверсия страницы 0,3%, увеличение бюджета вдвое просто удвоит расход."},

{t:"h", x:"Сквозной кейс: BrightFix"},
{t:"ex", title:"Знакомство с клиентом", body:[
"<b>BrightFix Appliance Repair</b> — сервис ремонта бытовой техники в Чикаго. Восемь выездных мастеров, работают по городу и ближним пригородам.",
"Как зарабатывают: клиент оставляет заявку или звонит, диспетчер согласует время, мастер выезжает, чинит на месте. Средний чек ремонта — <b>$180</b>. Валовая маржа после запчастей, топлива и оплаты мастера — <b>45%</b>, то есть <b>$81</b> с заказа.",
"Что уже есть: сайт с формой и телефоном, страница «Ремонт холодильников», страница «Ремонт стиральных машин», общая страница «Услуги».",
"Чего нет: аналитики, трекинга звонков, понимания, откуда идут заявки. Реклама крутилась полгода силами владельца, отчётов никто не смотрел.",
"Твоя задача как нового специалиста — разобраться, что происходит, и сделать канал управляемым. Это буквально типовая ситуация первого клиента."
]},

{t:"h", x:"Единицы измерения верха воронки"},
{t:"term", en:"Impression", ru:"показ", d:"Один случай, когда объявление было выведено на экран. Не означает, что человек его заметил, и тем более не означает, что он один. Показ — это единица инвентаря, который платформа продаёт."},
{t:"term", en:"Reach", ru:"охват", d:"Количество уникальных людей, увидевших объявление хотя бы раз. Охват всегда меньше или равен показам."},
{t:"term", en:"Frequency", ru:"частота", d:"Сколько раз в среднем один человек увидел объявление. Считается как показы, делённые на охват. Метрика здоровья креатива: когда частота растёт, а результат падает, аудитория устала."},
{t:"f", x:"Frequency = impressions / reach", note:"36 000 показов на 12 000 человек → частота 3,0"},
{t:"p", x:"В поисковой рекламе частота почти не используется: люди приходят по запросу, а не потому что ты их догнал. В Meta это одна из главных диагностических метрик, потому что там объявление показывается людям, которые тебя не искали."},

{t:"h", x:"Три формулы, которые надо знать наизусть"},
{t:"term", en:"CTR — click-through rate", ru:"кликабельность", d:"Доля показов, превратившихся в клики. Отвечает на вопрос, попадает ли объявление в аудиторию и в её задачу."},
{t:"f", x:"CTR = clicks / impressions × 100%"},
{t:"term", en:"CPC — cost per click", ru:"цена клика", d:"Средняя стоимость одного перехода. Зависит от конкуренции в нише, от качества объявления и от того, насколько запрос близок к покупке."},
{t:"f", x:"CPC = spend / clicks"},
{t:"term", en:"CPM — cost per mille", ru:"цена тысячи показов", d:"Сколько стоит купить тысячу показов. Базовая валюта в Meta: там ты по сути покупаешь показы, а количество кликов из них зависит от креатива."},
{t:"f", x:"CPM = spend / impressions × 1000"},

{t:"h", x:"Как эти три метрики связаны"},
{t:"p", x:"Это не три независимых числа, а одна система. Платформа продаёт показы, а цену клика ты получаешь как производную от того, насколько хорошо эти показы отрабатывают."},
{t:"f", x:"CPC = CPM / (CTR × 1000)", note:"CPM $8 и CTR 1,6% → CPC = 8 / 16 = $0,50"},
{t:"p", x:"Практический вывод, который стоит усвоить прямо сейчас: <b>улучшив CTR вдвое, ты вдвое удешевляешь клик</b>, не трогая ни ставки, ни бюджет. В Meta главный рычаг для этого — креатив. В поиске — релевантность объявления запросу."},

{t:"ex", title:"Считаем BrightFix, первый месяц", body:[
"Данные за месяц по поисковой кампании: расход <b>$2 400</b>, показов <b>60 000</b>, кликов <b>1 500</b>.",
"CTR = 1 500 / 60 000 = <b>2,5%</b>",
"CPC = 2 400 / 1 500 = <b>$1,60</b>",
"CPM = 2 400 / 60 000 × 1000 = <b>$40</b>",
"Проверим связь: 40 / (0,025 × 1000) = 40 / 25 = $1,60. Сходится.",
"Что из этого видно уже сейчас: CPM $40 — высокий, но для поиска это нормально, там покупается горячий трафик. Что нельзя сказать по этим цифрам: приносит ли кампания деньги. Для этого нужен следующий урок."
]},

{t:"h", x:"Метрики тщеславия"},
{t:"warn", x:"Показы, охват и CTR сами по себе не являются целями. Заголовок «Ремонт техники бесплатно» соберёт рекордный CTR и ни одного заказа. Эти метрики — диагностические: они объясняют, <b>почему</b> получился тот или иной результат, но не являются результатом."},
{t:"p", x:"Хорошее правило для отчётов: метрики выше клика идут в раздел «что происходит внутри», метрики ниже клика — в раздел «что получил бизнес». Владельцу BrightFix интересна вторая часть, тебе для работы нужны обе."},

{t:"h", x:"Что спрашивают на собеседовании"},
{t:"ul", items:[
"«CTR вырос, а конверсий стало меньше. Что случилось?» — скорее всего объявление стало привлекать более широкую и менее целевую аудиторию",
"«CPC вырос на 30% за месяц, что делать?» — сначала проверить, не изменился ли состав запросов и не зашёл ли новый конкурент в аукцион; повышение ставок это следствие, а не причина",
"«Чем CPM отличается от CPC» — базовый отсев, но спрашивают почти всегда"
]}
], quiz:[
{id:"q001", type:"num", q:"Кампания получила 48 000 показов и 1 200 кликов. Какой CTR в процентах?", unit:"%", answer:2.5, tol:0.05, hint:"CTR = клики делить на показы, умножить на 100.", explain:"1 200 / 48 000 = 0,025, то есть 2,5%."},
{id:"q002", type:"num", q:"Потрачено $840, получено 350 кликов. Чему равен CPC?", unit:"$", answer:2.4, tol:0.02, hint:"Расход делить на клики.", explain:"840 / 350 = $2,40 за клик."},
{id:"q003", type:"num", q:"Потрачено $270 на 45 000 показов. Чему равен CPM?", unit:"$", answer:6, tol:0.05, hint:"CPM считается на тысячу показов, а не на один.", explain:"270 / 45 000 × 1000 = $6,00 за тысячу показов."},
{id:"q004", type:"single", q:"CPM держится на $10, а CTR вырос с 1% до 2%. Что произошло с CPC?", options:[
 {t:"Упал вдвое", ok:true, why:"За те же $10 ты теперь получаешь 20 кликов вместо 10."},
 {t:"Вырос вдвое", why:"Наоборот: больше кликов за ту же цену показов означает более дешёвый клик."},
 {t:"Не изменился", why:"CPC напрямую зависит от CTR при фиксированном CPM."},
 {t:"Зависит от бюджета", why:"Бюджет определяет объём, а не цену клика."}
], explain:"CPC = CPM / (CTR × 1000). При CPM $10 и CTR 1% клик стоит $1,00; при CTR 2% — $0,50."},
{id:"q005", type:"num", q:"Meta-кампания BrightFix: охват 9 000 человек, показов 40 500. Чему равна частота?", unit:"", answer:4.5, tol:0.05, hint:"Показы делить на охват.", explain:"40 500 / 9 000 = 4,5. Высоковато для короткого периода — вероятно, аудитория узкая и креатив скоро выгорит."},
{id:"q006", type:"tf", q:"Верно ли: в модели PPC ты платишь за каждый показ объявления.", answer:false, explain:"В PPC оплата идёт за клик, показы бесплатны. За показы платят в модели CPM."},
{id:"q007", type:"multi", q:"Какие метрики можно посчитать, зная только расход, показы и клики? Отметь все.", options:[
 {t:"CTR", ok:true, why:"Клики / показы."},
 {t:"CPC", ok:true, why:"Расход / клики."},
 {t:"CPM", ok:true, why:"Расход / показы × 1000."},
 {t:"CPL", why:"Нужны данные о лидах, а их в этом наборе нет."}
], explain:"Расход, показы и клики дают весь верхний уровень воронки. Всё, что ниже клика, требует данных о конверсиях."},
{id:"q008", type:"single", q:"Владелец BrightFix говорит: «У нас конверсия сайта 0,4%, давай увеличим бюджет вдвое, будет вдвое больше заказов». Что ответить?", options:[
 {t:"Вдвое больше заказов будет, но и расход вырастет вдвое; сначала стоит заняться страницей, иначе мы просто удваиваем убыток", ok:true, why:"Реклама масштабирует существующую экономику, а не улучшает её."},
 {t:"Согласиться: рост бюджета всегда даёт рост заказов", why:"Рост будет, но при плохой конверсии он окажется убыточным."},
 {t:"Отказаться работать с таким сайтом", why:"Резко и непрофессионально: страница чинится, это обычная часть работы."},
 {t:"Предложить сменить рекламную платформу", why:"Проблема не в платформе, а в том, что происходит после клика."}
], explain:"Ключевая мысль урока: реклама умножает то, что уже есть. Слабое место после клика она не лечит."},
{id:"q009", type:"single", q:"CTR объявления вырос с 3% до 6%, но количество заявок осталось прежним. Наиболее вероятное объяснение?", options:[
 {t:"Новое объявление привлекает более широкую и менее целевую аудиторию", ok:true, why:"Больше кликов при том же числе заявок означает падение конверсии из клика."},
 {t:"Google начал показывать объявление чаще", why:"Частота показов не объясняет, почему добавочные клики не конвертируются."},
 {t:"Улучшилось качество целевой страницы", why:"Тогда заявок стало бы больше, а не столько же."},
 {t:"Снизилась конкуренция в аукционе", why:"Это повлияло бы на CPC, а не на конверсию кликов."}
], explain:"Рост CTR без роста результата — классический признак того, что объявление стало обещать что-то более широкое, чем ты продаёшь."},
{id:"q010", type:"num", q:"Meta-кампания: CPM $22, CTR 1,1%. Чему равен CPC?", unit:"$", answer:2, tol:0.05, hint:"CPC = CPM делить на (CTR в долях × 1000).", explain:"22 / (0,011 × 1000) = 22 / 11 = $2,00."}
]},

{ id:"m0l2", title:"От клика до денег и обратно", blocks:[
{t:"p", x:"Этот урок — сердце модуля. Здесь ты научишься считать, сколько можно платить за лид, чтобы бизнес зарабатывал. Именно этот расчёт отличает специалиста от человека, который «крутит рекламу»."},

{t:"h", x:"Ступень первая: конверсия"},
{t:"term", en:"Conversion", ru:"конверсия", d:"Целевое действие: заявка, звонок, покупка, регистрация. Что именно считать конверсией — твоё решение при настройке, и оно определяет, чему будет учиться алгоритм."},
{t:"term", en:"CVR — conversion rate", ru:"коэффициент конверсии", d:"Доля кликов, превратившихся в конверсии. Показатель качества связки «объявление → страница → оффер». Падение CVR почти всегда означает, что сломалось одно из трёх звеньев."},
{t:"f", x:"CVR = conversions / clicks × 100%"},
{t:"term", en:"CPA — cost per acquisition", ru:"цена целевого действия", d:"Сколько стоила одна конверсия. Универсальный термин для любой цели."},
{t:"term", en:"CPL — cost per lead", ru:"цена лида", d:"То же самое применительно к заявке в лидогенерации. В вакансиях по услугам встречается чаще, чем CPA."},
{t:"f", x:"CPA = spend / conversions", note:"Вторая форма той же формулы: CPA = CPC / CVR"},
{t:"p", x:"Вторая форма важнее первой. Она позволяет <b>прикинуть цену лида ещё до запуска</b>: если в нише клик стоит $3, а конверсия страницы 5%, то лид обойдётся примерно в $60. Этого достаточно, чтобы понять, стоит ли вообще заходить в канал."},

{t:"h", x:"Ступень вторая: деньги"},
{t:"term", en:"AOV — average order value", ru:"средний чек", d:"Выручка, делённая на количество заказов. Часто дешевле поднять средний чек, чем снизить стоимость привлечения."},
{t:"term", en:"Margin", ru:"маржа", d:"Доля выручки, остающаяся после прямых затрат на исполнение заказа. Именно из маржи, а не из выручки, оплачивается реклама."},
{t:"term", en:"ROAS — return on ad spend", ru:"возврат на рекламный расход", d:"Сколько выручки вернул каждый вложенный доллар. Главный KPI в e-commerce. Считается по выручке, а не по прибыли — отсюда частые заблуждения."},
{t:"f", x:"ROAS = revenue / spend"},
{t:"term", en:"Breakeven ROAS", ru:"точка безубыточности по ROAS", d:"Значение ROAS, при котором реклама не приносит и не теряет деньги. Считается как единица, делённая на маржу."},
{t:"f", x:"Breakeven ROAS = 1 / margin", note:"Маржа 25% → безубыточность при ROAS 4,0. Всё что ниже — убыток"},
{t:"term", en:"MER — marketing efficiency ratio", ru:"общая эффективность маркетинга", d:"Вся выручка бизнеса, делённая на весь рекламный расход по всем каналам. Не зависит от атрибуции, поэтому ему доверяют финансисты и им обычно заканчивается спор о том, чьи цифры правильные."},

{t:"h", x:"Ступень третья: клиент"},
{t:"term", en:"CAC — customer acquisition cost", ru:"стоимость привлечения клиента", d:"Сколько стоит привести не заявку, а оплатившего клиента. Всегда выше CPL, потому что не каждый лид покупает."},
{t:"f", x:"CAC = CPL / lead-to-customer rate"},
{t:"term", en:"LTV — lifetime value", ru:"пожизненная ценность клиента", d:"Сколько маржи клиент приносит за всё время сотрудничества, с учётом повторных покупок. Если LTV меньше CAC, бизнес теряет деньги на каждом новом клиенте."},
{t:"term", en:"Payback period", ru:"срок окупаемости клиента", d:"За сколько месяцев клиент возвращает потраченное на его привлечение. Критично там, где деньги приходят частями: подписки, сервисные контракты, повторные визиты."},

{t:"h", x:"Главный расчёт профессии: сколько можно платить за лид"},
{t:"p", x:"Считается всегда в одну сторону — <b>от денег назад к рекламе</b>. Сначала определяем, сколько маржи приносит клиент. Потом — сколько лидов нужно на одного клиента. Потом — какую часть маржи бизнес готов отдать на привлечение."},
{t:"ex", title:"BrightFix: считаем допустимый CPL", body:[
"Средний чек $180, маржа 45% → с одного заказа остаётся <b>$81</b>.",
"Из истории видно: примерно <b>40%</b> заявок превращаются в оплаченный выезд. Остальные — не дозвонились, передумали, не устроила цена или не наша техника.",
"Значит маржа с одной заявки: 81 × 0,40 = <b>$32,40</b>.",
"Владелец готов отдавать на привлечение не больше половины маржи, чтобы оставалось на аренду, диспетчера и прибыль. Значит <b>допустимый CPL = $16</b>.",
"Проверим реальность: при CPC $1,60 это требует конверсии сайта 1,60 / 16 = <b>10%</b>. Для узкой страницы «Ремонт холодильников» с формой и телефоном это достижимо, для общей страницы «Услуги» — почти нет.",
"Первый вывод по клиенту, который можно озвучить на второй встрече: <b>трафик нужно вести на узкие страницы под конкретную технику, а не на общую</b>."
]},
{t:"ex", title:"Что меняется при повторных заказах", body:[
"Половина клиентов BrightFix обращается повторно в течение двух лет. Значит LTV примерно 81 × 1,5 = <b>$121,50</b>, а не $81.",
"Пересчёт: маржа с заявки становится 121,50 × 0,40 = $48,60, а допустимый CPL при той же логике — <b>$24</b>.",
"Разница между $16 и $24 — это полтора раза по допустимой цене лида, то есть совсем другой доступный объём трафика. Вот почему вопрос «а сколько клиентов возвращается» надо задавать на первой же встрече."
]},

{t:"h", x:"Второй кейс: e-commerce"},
{t:"ex", title:"Kestrel Supply, магазин рюкзаков", body:[
"AOV $120, маржа после себестоимости и доставки 35%.",
"Breakeven ROAS = 1 / 0,35 = <b>2,86</b>. Ниже этого значения каждая продажа приносит убыток.",
"Владелец хочет зарабатывать, а не работать в ноль, поэтому целевой ROAS ставим <b>4,0</b>. Это оставляет запас на операционные расходы.",
"При ROAS 4,0 и AOV $120 допустимый CPA = 120 / 4 = <b>$30</b>.",
"Типичная ошибка новичка: увидеть в кабинете ROAS 3,2, обрадоваться и начать масштабировать. При марже 35% это работа почти в ноль."
]},
{t:"warn", x:"ROAS считается по выручке. ROAS 4,0 звучит отлично и означает убыток при марже 20%. Первый вопрос любому клиенту e-commerce: какая у вас маржа."}
], quiz:[
{id:"q020", type:"num", q:"Кампания дала 620 кликов и 31 заявку. Чему равен CVR в процентах?", unit:"%", answer:5, tol:0.05, hint:"Конверсии делить на клики.", explain:"31 / 620 = 0,05 → 5%."},
{id:"q021", type:"num", q:"CPC $3,20, CVR 4%. Чему равен CPA?", unit:"$", answer:80, tol:0.5, hint:"CPA = CPC / CVR, где CVR в долях (4% = 0,04).", explain:"3,20 / 0,04 = $80. Эта формула позволяет прикинуть CPA ещё до запуска."},
{id:"q022", type:"num", q:"Потрачено $4 500, выручка $15 750. Чему равен ROAS в разах?", unit:"×", answer:3.5, tol:0.05, hint:"Выручка делить на расход.", explain:"15 750 / 4 500 = 3,5. Каждый вложенный доллар вернул $3,50 выручки."},
{id:"q023", type:"num", q:"Маржа интернет-магазина 40%. Чему равен breakeven ROAS?", unit:"×", answer:2.5, tol:0.05, hint:"Единица делить на маржу в долях.", explain:"1 / 0,4 = 2,5. Ниже этого значения каждая продажа убыточна."},
{id:"q024", type:"num", q:"CPL $60, в клиента превращается 25% лидов. Чему равен CAC?", unit:"$", answer:240, tol:1, hint:"Нужно четыре лида, чтобы получить одного клиента.", explain:"60 / 0,25 = $240."},
{id:"q025", type:"num", q:"BrightFix: средний чек $180, маржа 45%, в оплаченный выезд превращается 40% заявок. Какова маржа с одной заявки?", unit:"$", answer:32.4, tol:0.3, hint:"Сначала маржа с заказа, потом умножить на долю заявок, доходящих до оплаты.", explain:"180 × 0,45 = $81 с заказа. 81 × 0,40 = $32,40 с заявки. Это потолок, выше которого платить за лид нельзя ни при каких условиях."},
{id:"q026", type:"single", q:"ROAS кампании 4,0, маржа товара 20%. Как оценить результат?", options:[
 {t:"Это убыток: точка безубыточности при марже 20% наступает на ROAS 5,0", ok:true, why:"1 / 0,2 = 5,0, а у нас 4,0."},
 {t:"Отличный результат, надо масштабировать", why:"Масштабирование убытка увеличит убыток."},
 {t:"Результат нейтральный, ровно в ноль", why:"В ноль было бы при ROAS 5,0."},
 {t:"По этим данным вывод сделать нельзя", why:"Маржи и ROAS достаточно для однозначного вывода."}
], explain:"Отсюда правило: ROAS без маржи — бессмысленное число. Всегда спрашивай маржу первым делом."},
{id:"q027", type:"single", q:"Владелец BrightFix сообщил, что половина клиентов возвращается в течение двух лет. Как это меняет твою работу?", options:[
 {t:"Растёт LTV, а значит и допустимая цена лида — можно покупать более дорогой трафик", ok:true, why:"Повторные заказы увеличивают маржу с одного привлечённого клиента."},
 {t:"Ничего не меняет, считать надо по первому заказу", why:"Тогда ты недооценишь доступный бюджет и упустишь объём."},
 {t:"Надо снизить целевой CPL, раз клиенты и так возвращаются", why:"Логика обратная: возвраты позволяют платить больше, а не меньше."},
 {t:"Нужно перевести кампанию на оптимизацию по кликам", why:"Стратегия оптимизации к сроку жизни клиента отношения не имеет."}
], explain:"В кейсе допустимый CPL вырос с $16 до $24 — это в полтора раза больше доступного трафика при той же экономике."},
{id:"q028", type:"multi", q:"Какие метрики нельзя получить из рекламного кабинета без дополнительных данных? Отметь все.", options:[
 {t:"LTV", ok:true, why:"Требует истории покупок из CRM или биллинга."},
 {t:"CAC", ok:true, why:"Нужна доля лидов, ставших клиентами, а её знает отдел продаж."},
 {t:"CTR", why:"Считается из показов и кликов прямо в кабинете."},
 {t:"MER", ok:true, why:"Нужна общая выручка бизнеса, а не только атрибутированная реклама."}
], explain:"Всё, что связано с реальными деньгами компании, живёт вне кабинета. Умение связать два мира — главное отличие сильного специалиста."},
{id:"q029", type:"tf", q:"Верно ли: CPL всегда меньше или равен CAC.", answer:true, explain:"Лид — промежуточный шаг. Раз не каждый лид становится клиентом, привлечение клиента не может стоить дешевле привлечения лида."},
{id:"q030", type:"num", q:"Kestrel Supply: AOV $120, целевой ROAS 4,0. Какой максимальный CPA можно себе позволить?", unit:"$", answer:30, tol:0.5, hint:"Средний чек делить на целевой ROAS.", explain:"120 / 4 = $30. Выше этого значения целевой ROAS не выдерживается."},
{id:"q031", type:"single", q:"Канал A: CPL $25, в клиента превращается 5%. Канал B: CPL $80, в клиента превращается 30%. Какой выгоднее?", options:[
 {t:"B: CAC $267 против $500 у канала A", ok:true, why:"25 / 0,05 = $500, а 80 / 0,30 ≈ $267."},
 {t:"A: цена лида втрое ниже", why:"Цена лида не говорит ничего без конверсии в клиента."},
 {t:"Одинаково, разница компенсируется", why:"Разница почти двукратная в пользу B."},
 {t:"Нельзя сравнить без данных о выручке", why:"Для сравнения между собой достаточно CAC."}
], explain:"Самый частый и самый дорогой самообман в лидогенерации: оптимизировать CPL вместо CAC."}
]},

{ id:"m0l3", title:"Воронка: где именно теряются деньги", blocks:[
{t:"p", x:"Воронка нужна не для красивой картинки в презентации. Это диагностический инструмент: когда результат плохой, воронка показывает, на каком именно шаге всё сломалось, и не даёт чинить наугад."},

{t:"h", x:"Полная цепочка"},
{t:"f", x:"Показ → клик → визит → конверсия → лид → MQL → SQL → сделка → оплата", note:"На каждом переходе есть своя метрика и свой ответственный"},
{t:"term", en:"Lead", ru:"лид", d:"Человек, оставивший контакт. Ещё не клиент и часто вообще не целевой."},
{t:"term", en:"MQL — marketing qualified lead", ru:"лид, пригодный для маркетинга", d:"Лид, который по формальным признакам похож на целевого: нужный регион, нужный тип запроса, реальные контакты. Отсеивается на стороне маркетинга."},
{t:"term", en:"SQL — sales qualified lead", ru:"лид, принятый в продажи", d:"Лид, который отдел продаж посмотрел и признал годным для работы. Доля SQL — главный честный показатель качества трафика."},
{t:"term", en:"Opportunity", ru:"сделка в работе", d:"Лид, дошедший до обсуждения условий. В CRM это отдельная стадия с суммой и вероятностью закрытия."},
{t:"term", en:"Close rate", ru:"доля закрытых сделок", d:"Какая часть сделок доходит до оплаты. Считается отделом продаж, но напрямую зависит от того, какой трафик ты привёл."},

{t:"h", x:"Разбор воронки BrightFix"},
{t:"ex", title:"Что показали цифры за месяц", body:[
"60 000 показов → 1 500 кликов → 1 350 визитов → 95 заявок → 71 дозвон → 38 оплаченных выездов.",
"Считаем переходы: CTR 2,5%, потеря на загрузке страницы 10%, CVR 7,0%, дозвон 75%, оплата 54%.",
"Расход $2 400 → CPL = 2 400 / 95 = <b>$25,26</b>. Допустимый CPL мы посчитали как $16 (или $24 с учётом повторных заказов).",
"Стоимость оплаченного выезда: 2 400 / 38 = <b>$63,16</b> при марже с заказа $81. То есть бизнес зарабатывает, но всего $18 с выезда — это слишком тонко.",
"Где узкое место? Дозвон 75% выглядит нормально. Оплата 54% — тоже. А вот <b>потеря 25% заявок на дозвоне</b> в абсолютных числах это 24 заявки по $25 — почти $600 выброшенных денег в месяц, и чинится это не рекламой, а скоростью ответа диспетчера."
]},
{t:"p", x:"Обрати внимание на приём: сначала считаем проценты по каждому переходу, потом переводим самый слабый переход в деньги. Процент сам по себе не убеждает клиента, а «мы теряем $600 в месяц на том, что не берут трубку» — убеждает."},

{t:"h", x:"Диагностическая таблица"},
{t:"tab", head:["Симптом","Вероятная причина","Что проверять"], rows:[

["Клики есть, визитов меньше","Медленная страница или ошибка перехода","Скорость загрузки, работоспособность ссылки на мобильном"],
["Высокий CTR, низкий CVR","Обещание в объявлении не совпадает со страницей","Message match, содержание и форма страницы"],
["Хороший CVR, мало SQL","Трафик нецелевой, оффер привлекает не тех","Отчёт по запросам, гео, формулировку оффера"],
["Заявки есть, дозвона нет","Проблема на стороне бизнеса","Скорость ответа, часы работы, качество контактов"],
["Всё хорошо, денег нет","Экономика не сходится изначально","Маржу, средний чек, допустимый CPL"]
]},

{t:"h", x:"Почему CPL в одиночку врёт"},
{t:"p", x:"Алгоритмы обучаются на том, что ты отдаёшь им как конверсию. Если конверсией считается любое заполнение формы, платформа начнёт искать людей, которые охотно заполняют формы. Это не те же самые люди, что платят деньги."},
{t:"warn", x:"Аккаунты, которые оптимизируются только на заполнение формы, кормят алгоритм мусорным сигналом. Симптом всегда один: CPL падает, количество заявок растёт, количество сделок стоит на месте."},
{t:"term", en:"Lead quality", ru:"качество лида", d:"Насколько привлечённые заявки соответствуют реальному покупателю. Измеряется долей SQL и долей закрытых сделок, а не количеством заявок."},
{t:"p", x:"Решение, к которому мы придём в модуле по измерению: <b>вернуть в рекламную платформу информацию о том, какие лиды стали деньгами</b>. Тогда алгоритм начинает искать похожих на покупателей, а не похожих на заполнителей форм."},

{t:"h", x:"Как разговаривать с отделом продаж"},
{t:"p", x:"Фраза «лиды плохие» в исполнении продажников означает что угодно. Задача специалиста — перевести её в проверяемое. Три вопроса, которые это делают:"},
{t:"ul", items:[

]}
], quiz:[
{id:"q040", type:"num", q:"1 500 кликов дали 90 заявок, из них 36 получили статус SQL. Какая доля заявок стала SQL, в процентах?", unit:"%", answer:40, tol:0.5, hint:"SQL делить на заявки.", explain:"36 / 90 = 0,4 → 40%. Ключевой показатель качества трафика."},
{id:"q041", type:"num", q:"BrightFix: 95 заявок за месяц, дозвониться удалось до 71. Сколько заявок потеряно на этом шаге?", unit:"заявок", answer:24, tol:0.5, hint:"Простая разность.", explain:"95 − 71 = 24 заявки. При CPL $25 это около $600 выброшенных за месяц денег."},
{id:"q042", type:"single", q:"В аккаунте CPL снизился с $70 до $40, но количество сделок не изменилось. Как это трактовать?", options:[
 {t:"Качество лидов упало — стало больше дешёвых нецелевых заявок", ok:true, why:"Лидов больше при том же результате, значит доля годных снизилась."},
 {t:"Отличный результат, можно масштабировать", why:"Денег бизнес получает столько же, а расход вырос."},
 {t:"Это ошибка трекинга", why:"Возможно, но первая и самая частая причина — смещение трафика в сторону низкого интента."},
 {t:"Надо снизить бюджет", why:"Сначала нужно понять причину."}
], explain:"Падение CPL без роста сделок — классический признак того, что алгоритм нашёл дешёвую аудиторию с низким интентом."},
{id:"q043", type:"single", q:"Что правильнее всего отдавать платформе как основную конверсию в лидогенерации услуг?", options:[
 {t:"Заявку, подтверждённую как годную на стороне бизнеса", ok:true, why:"Сигнал ближе к деньгам, алгоритм учится искать похожих."},
 {t:"Любое заполнение формы", why:"Самый мусорный сигнал: платформа начнёт искать любителей форм."},
 {t:"Просмотр страницы «Контакты»", why:"Слишком слабый сигнал, напрямую не связан с деньгами."},

], explain:"Чем ближе сигнал к деньгам, тем лучше работает автоматика. Обратная сторона — таких событий меньше, поэтому иногда комбинируют основную и вспомогательную цели."},
{id:"q044", type:"multi", q:"Воронка: 50 000 показов → 500 кликов → 50 заявок → 5 SQL. Какие выводы обоснованы? Отметь все.", options:[

], explain:"Хороший CVR при низкой доле SQL — признак того, что оффер или запросы привлекают нецелевых людей."},
{id:"q045", type:"single", q:"Высокий CTR при низком CVR. Что проверять в первую очередь?", options:[

], explain:"Люди охотно кликают, но уходят — значит объявление обещает не то, что они находят."},
{id:"q046", type:"tf", q:"Верно ли: рост количества лидов всегда означает улучшение результата для бизнеса.", answer:false, explain:"Количество лидов без их качества ничего не говорит. Приоритет маркетологов в 2026 сместился именно к качеству лидов и конверсии лида в клиента."},

], explain:"Задача специалиста — перевести «плохие лиды» в конкретный признак, который можно отсечь настройками или минус-словами."},
{id:"q048", type:"num", q:"Воронка: 1 200 кликов, 84 заявки, 42 SQL, 14 сделок. Какая доля кликов доходит до сделки, в процентах?", unit:"%", answer:1.17, tol:0.05, hint:"Сделки делить на клики.", explain:"14 / 1 200 = 0,0117 → около 1,17%. Полезная привычка — считать сквозную конверсию, а не только по соседним шагам."},

 {t:"Строго до клика", why:"За трафик без результата платить никто не будет."},
 {t:"До закрытия сделки включительно", why:"Закрытие — работа отдела продаж."},

], explain:"Формально твоя зона — до конверсии. Практически на собеседовании спросят, как ты обеспечиваешь качество лида."}
]},

{t:"ex", title:"BrightFix: сводим три цифры", body:[
"Google Ads показывает <b>112</b> конверсий, GA4 — <b>95</b> ключевых событий, в CRM за тот же месяц <b>95</b> заявок, из которых 12 пришли не с рекламы.",
"Разбор: Google засчитал 17 конверсий сверх GA4 — часть из них view-through и звонки по отложенному клику, часть попала в окно 30 дней с прошлого месяца.",
"GA4 и CRM сошлись по цифре 95, но это совпадение: в GA4 95 событий с рекламы, а в CRM 95 всех заявок вместе с органикой. Реально с рекламы пришло 83.",
"Что сказать клиенту: «С рекламы в этом месяце 83 заявки, цена $28,90. Google в своём интерфейсе показывает 112, потому что учитывает отложенные конверсии и просмотры — это нормально, для управления кампанией я смотрю на его данные, а для разговора о деньгах на CRM».",
"Такой ответ, произнесённый спокойно и без оправданий, обычно снимает вопрос навсегда."
]},

 {t:"Человек просмотрел видео до конца", why:"Это видеометрика, к атрибуции отношения не имеет."},
 {t:"Конверсия по последнему клику", why:"Это click-through, противоположность."},
 {t:"Конверсия, подтверждённая отделом продаж", why:"Это про качество лида, а не про модель атрибуции."}
], explain:"View-through — главная причина, по которой Meta показывает больше конверсий, чем GA4: GA4 их вообще не видит."},
{id:"q062", type:"tf", q:"Верно ли: GA4 обычно показывает меньше конверсий по рекламному каналу, чем сам рекламный кабинет.", answer:true, explain:"GA4 не учитывает view-through и теряет часть данных из-за блокировщиков и отказов от согласия."},
{id:"q063", type:"single", q:"Окно конверсии в Google Ads 30 дней. Клик 1 марта, заявка 25 марта. Что произойдёт?", options:[

], explain:"Отнесение к дате клика — причина, по которой нельзя судить о вчерашнем дне сразу."},
{id:"q064", type:"multi", q:"Для каких задач какой источник правильнее? Отметь все верные утверждения.", options:[

 {t:"Отчёт о деньгах — CRM или финансы", ok:true, why:"Только там видны реальные сделки."},

{id:"q065", type:"tf", q:"Верно ли: last click недооценивает каналы, работающие в начале пути клиента.", answer:true, explain:"Вся заслуга уходит последнему касанию, поэтому знакомящие с брендом каналы выглядят бесполезными и их режут по ошибке."},
{id:"q066", type:"single", q:"Клиент спрашивает: «Почему у вас в отчёте 83 заявки, а Google говорит 112? Вы занижаете?» Лучший ответ?", options:[

 {t:"Показать цифру Google, раз она больше", why:"Сознательное завышение, за которое придётся отвечать при сверке с деньгами."},
 {t:"Сказать, что Google завышает и его данным доверять нельзя", why:"Неточно: его данные нужны для оптимизации кампании."},

], explain:"Умение объяснить расхождение без оправданий — признак того, что специалист понимает, как устроено измерение."},

 {t:"Постепенное увеличение бюджета", why:"Это масштабирование."},
 {t:"Рост конверсий месяц к месяцу", why:"Это динамика, а не инкрементальность."},

], explain:"Ключевая идея: часть конверсий случилась бы и без рекламы. Особенно это касается брендовых запросов."},

]},

{ id:"m0l5", title:"Планирование: считаем от денег назад", blocks:[
{t:"p", x:"Последний урок модуля и самый практичный. Умение построить медиаплан до запуска — то, что чаще всего дают в тестовом задании, и то, чего почти никогда не умеют кандидаты без опыта."},

{t:"h", x:"Принцип"},
{t:"p", x:"Планирование всегда идёт <b>от бизнес-цели назад к бюджету</b>, а не от бюджета вперёд к надеждам. Направление расчёта такое:"},
{t:"f", x:"Цель по выручке → сделки → лиды → клики → бюджет", note:"Каждый шаг делится на конверсию соответствующего перехода"},

{t:"ex", title:"BrightFix: план на следующий квартал", body:[
"<b>Цель владельца:</b> дополнительно 90 оплаченных выездов за квартал, то есть 30 в месяц.",
"<b>Шаг 1. Сколько нужно заявок.</b> В оплату превращается 40% заявок → 30 / 0,40 = <b>75 заявок в месяц</b>.",
"<b>Шаг 2. Сколько нужно кликов.</b> Конверсия сайта 7% → 75 / 0,07 ≈ <b>1 072 клика в месяц</b>.",
"<b>Шаг 3. Сколько это стоит.</b> CPC $1,60 → 1 072 × 1,60 ≈ <b>$1 715 в месяц</b>.",
"<b>Шаг 4. Проверка экономики.</b> CPL = 1 715 / 75 = $22,87. Допустимый CPL с учётом повторных заказов — $24. Проходим, но впритык.",
"<b>Шаг 5. Проверка реальности.</b> Хватит ли спроса на 1 072 клика в месяц? Это проверяется в Keyword Planner и по показателю доли полученных показов. Если ниша выбирает только 600 кликов, план недостижим при любом бюджете, и об этом надо сказать до старта, а не через месяц."
]},
{t:"warn", x:"Пятый шаг пропускают чаще всего. План, который красиво считается на бумаге, но упирается в потолок спроса, — самый быстрый способ испортить отношения с клиентом в первый же месяц."},

{t:"h", x:"Обратная задача: дали бюджет, что обещать"},
{t:"ex", title:"«У нас есть $5 000 в месяц, сколько будет заявок?»", body:[
"Считаем в обратную сторону: 5 000 / 1,60 = 3 125 кликов → × 7% = <b>219 заявок</b> → × 40% = <b>87 выездов</b>.",
"Но прежде чем называть эту цифру, нужны две поправки.",
"<b>Поправка на спрос:</b> если доступный объём ниши 1 500 кликов в месяц, то $5 000 просто не открутятся, либо CPC вырастет из-за более широких и дорогих запросов. Честный ответ: «в текущей нише мы освоим примерно $2 400, для остального нужно расширять географию или добавлять каналы».",
"<b>Поправка на период обучения:</b> первые 2–4 недели результат будет хуже расчётного. Обещать плановые цифры с первого месяца нельзя.",
"Итоговая формулировка для клиента: диапазон, а не точка. «Ожидаю 70–90 выездов в месяц на третий месяц работы, в первый месяц — 40–55»."
]},
{t:"p", x:"Привычка называть диапазон вместо точного числа — профессиональный навык. Точное число ты не можешь знать, а диапазон показывает, что ты понимаешь источники неопределённости."},

{t:"h", x:"Контроль расхода в течение месяца"},
{t:"term", en:"Pacing", ru:"темп расхода бюджета", d:"Соотношение фактического расхода с планом. Проверяется минимум раз в неделю, иначе перерасход обнаруживается в последний день месяца, когда сделать уже ничего нельзя."},
{t:"f", x:"Прогноз расхода = расход на сегодня / прошло дней × дней в месяце"},
{t:"ex", title:"Задача на pacing", body:[
"Месячный бюджет $9 000. Прошло 18 дней, потрачено $6 300.",
"Прогноз: 6 300 / 18 × 30 = <b>$10 500</b>. Перерасход $1 500, то есть 17%.",
"Варианты: снизить дневные бюджеты примерно на 20% на оставшиеся 12 дней, либо согласовать увеличение месячного бюджета, если результат того стоит.",
"Что нельзя: просто выключить кампании на неделю. Это обрушит обучение алгоритма и в следующем месяце придётся начинать заново."
]},

{t:"h", x:"Типовое тестовое задание"},
{t:"p", x:"Почти во всех агентствах тестовое задание для джуниора выглядит одинаково: дают нишу, бюджет и цель, просят прислать план. Проверяют не красоту таблицы, а наличие логики."},
{t:"ul", items:[
"Расчёт идёт от цели назад, а не от бюджета вперёд",
"Указаны допущения: откуда взята конверсия, откуда CPC, что сделано, если данных нет",
"Проверен потолок спроса, а не только арифметика",
"Названы риски и что будет, если предположения не подтвердятся",
"Результат дан диапазоном, с оговоркой про период обучения"
]},
{t:"p", x:"Наличие всех пяти пунктов ставит тебя выше большинства кандидатов, даже если сами цифры окажутся неточными. Неточные цифры на старте — норма. Отсутствие логики — нет."}

{id:"e011", type:"single", q:"Что означает MER и чем он отличается от ROAS?", options:[

 {t:"То же самое, что ROAS, просто другое название", why:"ROAS считается по атрибутированной выручке конкретного канала."},

{id:"e012", type:"single", q:"CPL упал на 45%, доля SQL упала с 35% до 12%. Что делать первым делом?", options:[

 {t:"Радоваться снижению CPL и увеличивать бюджет", why:"CAC при этом вырос, масштабирование усилит убыток."},
 {t:"Перевести кампанию на оплату за показы", why:"Модель оплаты не влияет на качество аудитории."},

], explain:"Падение CPL при падении доли SQL означает, что алгоритм нашёл дешёвых нецелевых людей."},
{id:"e013", type:"multi", q:"Какие утверждения верны? Отметь все.", options:[

 {t:"CPC = CPM / (CTR × 1000)", ok:true, why:"Связывает оплату за показы с ценой клика."},
 {t:"ROAS = spend / revenue", why:"Наоборот: выручка делить на расход."},

{id:"e015", type:"single", q:"Что такое SQL в контексте воронки?", options:[

{
id:"m1", num:1, title:"Измерение: GA4, GTM и конверсии", subtitle:"Руками, по шагам, до рабочего трекинга", duration:"4 дня", pass:80,
intro:"Практический модуль. Здесь не только теория: в каждом уроке есть пошаговая инструкция — куда зайти, что нажать, как проверить. К концу модуля ты умеешь поднять конверсионный трекинг сайта с нуля и доказать, что он работает. Продолжаем вести BrightFix.",
lessons:[

{ id:"m1l1", title:"Что и в каком порядке настраивать", blocks:[
{t:"p", x:"Раньше специалист управлял ставками, устройствами, временем показа и точными ключами. Сейчас эти рычаги либо сокращены, либо убраны: автоматика взяла их на себя. Обучается она на конверсиях, которые ты ей передаёшь. Поэтому трекинг — не скучная подготовка перед «настоящей работой», а и есть главный рычаг."},
{t:"f", x:"Плохой сигнал → плохое обучение → плохой результат", note:"Никакая оптимизация не вытянет кампанию, если алгоритм учится на мусоре"},

{t:"h", x:"Что изменилось к 2026"},
{t:"ul", items:[
"Google переводит кампании со старыми настройками на AI Max: с сентября 2026 автоматически апгрейдятся кампании с automatically created assets и с настройкой broad match на уровне кампании",
"Meta с системой Andromeda определяет аудиторию по креативу, а не по настройкам таргетинга, и качество конверсионного сигнала стало прямым рычагом эффективности",
"С 15 июня 2026 Google убрал настройку Google Signals как контроль передачи данных из GA4 в Google Ads — теперь всё решает параметр ad_storage в Consent Mode"
]},
{t:"warn", x:"Поломка трекинга в 2026 не выглядит как ошибка. Ничего не падает, уведомлений нет. Конверсии тихо перестают доезжать, алгоритм слепнет, результат ползёт вниз неделями. Именно поэтому проверка трекинга — еженедельная рутина, а не разовая настройка."},

{t:"h", x:"Шесть слоёв измерения"},
{t:"tab", head:["Слой","Задача","Инструмент"], rows:[

["Сбор событий","Зафиксировать, что человек сделал","GTM + GA4"],
["Передача в рекламу","Сообщить платформе о конверсии","Conversion action, Pixel, CAPI"],
["Улучшение сопоставления","Помочь платформе узнать человека","Enhanced conversions, EMQ"],
["Согласие","Соблюсти закон и не потерять данные","Consent Mode v2"],
["Обратная связь","Передать качество лида обратно","Offline conversion import"]
]},

{t:"h", x:"Порядок работы на реальном проекте"},

{t:"steps", title:"С нуля до рабочего трекинга", items:[
"<b>Договориться, что считается результатом.</b> Записать словами: «заявка через форму на странице услуги» и «клик по номеру телефона с мобильного». Без этого шага всё остальное бессмысленно.",
"<b>Поставить GTM на сайт.</b> Один раз, руками разработчика или через плагин CMS.",
"<b>Создать GA4 и подключить его через GTM.</b> Проверить, что базовые события идут.",
"<b>Настроить события конверсий в GTM</b> и убедиться в Preview, что они срабатывают ровно когда надо.",
"<b>Пометить их как key events в GA4</b> и дождаться появления в отчётах.",
"<b>Создать конверсии в Google Ads</b> — импортом из GA4 либо нативным тегом. Одно действие — один способ, не оба.",

"<b>Включить enhanced conversions</b> и проверить EMQ.",
"<b>Настроить Consent Mode</b>, если есть трафик из ЕС или Великобритании.",
"<b>Передать gclid в CRM</b> и организовать выгрузку сделок обратно в Google Ads."
]},

{t:"h", x:"Аккаунты, которые понадобятся"},

{t:"ul", items:[

"<b>Google Ads</b> — ads.google.com (аккаунт создаётся бесплатно, деньги вносить не обязательно для изучения интерфейса)",
"<b>Meta Business Suite</b> — business.facebook.com, внутри него Events Manager",
"<b>Тестовый сайт</b> — любой. Подойдёт бесплатный сайт на Tilda, WordPress, Carrd или собранная тобой одностраничница на GitHub Pages"

{t:"ex", title:"Что сделать по ходу модуля", body:[
"Это не теоретический модуль. К его концу у тебя должен быть <b>работающий тестовый сайт с полным трекингом</b> — это первый артефакт портфолио.",

]}

"В левом меню выбрать <b>Variables</b>.",
"В верхнем блоке <b>Built-In Variables</b> нажать <b>Configure</b>.",
"Отметить галочками всё в группах <b>Clicks</b> (Click Element, Click Classes, Click ID, Click Target, Click URL, Click Text) и <b>Forms</b> (Form Element, Form Classes, Form ID, Form Target, Form URL, Form Text).",
"Закрыть панель. Галочки сохраняются сразу, отдельной кнопки сохранения нет."
]},

{t:"h", x:"Первый тег: подключаем GA4"},
{t:"p", x:"Прежде чем настраивать конверсии, нужно, чтобы GA4 вообще начал получать данные с сайта. Идентификатор GA4 мы возьмём в следующем уроке, здесь важна механика."},
{t:"steps", title:"Тег Google Tag", items:[
"Раздел <b>Tags</b> → кнопка <b>New</b> в правом верхнем углу.",
"Кликнуть в блок <b>Tag Configuration</b> — откроется список типов тегов.",
"Выбрать <b>Google Tag</b>.",
"В поле <b>Tag ID</b> вставить идентификатор вида <code>G-XXXXXXXXXX</code> из GA4.",
"Кликнуть в блок <b>Triggering</b> ниже и выбрать <b>Initialization — All Pages</b>.",
"Вверху слева дать тегу понятное имя, например <code>GA4 — Base</code>.",
"Нажать <b>Save</b>."
]},
{t:"p", x:"Имена тегов — не мелочь. Через полгода в контейнере будет тридцать тегов, и разбираться в названиях вида «Тег 1», «Тег 1 копия» невозможно. Рабочее соглашение: тип платформы, тире, что делает. <code>GA4 — Form Submit</code>, <code>Ads — Conversion Lead</code>, <code>Meta — Pixel Base</code>."},

{t:"h", x:"Режим отладки"},
{t:"term", en:"Preview mode", ru:"режим предпросмотра", d:"Окно Tag Assistant, показывающее в реальном времени, какие теги сработали, на каком событии и с какими значениями переменных. Без него настраивать теги нельзя."},
{t:"steps", title:"Как пользоваться Preview", items:[
"Нажать <b>Preview</b> в правом верхнем углу GTM.",
"В открывшемся окне ввести адрес сайта, нажать <b>Connect</b>.",
"Сайт откроется в новой вкладке с плашкой внизу. В соседней вкладке Tag Assistant идёт лента событий.",
"Слева в ленте — последовательность событий: Container Loaded, DOM Ready, Window Loaded и дальше всё, что происходит.",
"Кликнув на событие, видишь две колонки: <b>Tags Fired</b> (сработавшие) и <b>Tags Not Fired</b> (не сработавшие).",
"Вкладка <b>Variables</b> внутри события показывает значения всех переменных в этот момент — именно там смотрят, что подставилось в тег.",
"Сделай на сайте целевое действие и проверь, что нужный тег появился в Tags Fired ровно один раз."
]},
{t:"warn", x:"Изменения в GTM не работают на живом сайте, пока контейнер не опубликован. Preview показывает их только тебе. Публикация — кнопка <b>Submit</b> в правом верхнем углу, затем Publish с описанием версии."}
], quiz:[
{id:"q110", type:"single", q:"Что такое триггер в GTM?", options:[
 {t:"Условие, при котором тег срабатывает", ok:true, why:"Тег — что делаем, триггер — когда."},
 {t:"Код, отправляющий данные в GA4", why:"Это тег."},
 {t:"Значение, подставляемое в тег", why:"Это переменная."},
 {t:"Контейнер на сайте", why:"Контейнер — общая оболочка."}
], explain:"Связка: тег — что, триггер — когда, переменная — с какими значениями."},
{id:"q111", type:"single", q:"Какой первый шаг нужно сделать в любом новом контейнере GTM, прежде чем настраивать триггеры на клики?", options:[
 {t:"Включить встроенные переменные в группах Clicks и Forms через Variables → Configure", ok:true, why:"Без них триггеры на клики и формы не на чем строить."},
 {t:"Создать тег Google Tag", why:"Нужный шаг, но переменные понадобятся раньше для триггеров."},
 {t:"Опубликовать контейнер", why:"Публиковать пока нечего."},
 {t:"Создать папку Folders", why:"Организационная мелочь, не обязательна."}
], explain:"GTM по умолчанию включает лишь часть переменных. Остальные включаются вручную одной галочкой каждая."},
{id:"q112", type:"single", q:"Где в GTM посмотреть, какие теги сработали на конкретном действии и с какими значениями?", options:[
 {t:"В Preview — вкладка Tag Assistant, блоки Tags Fired и Variables", ok:true, why:"Основной инструмент отладки."},
 {t:"В разделе Versions", why:"Там история опубликованных версий."},
 {t:"В разделе Admin", why:"Там настройки аккаунта и доступы."},
 {t:"В GA4 в отчёте Traffic acquisition", why:"Там видно результат, но не механику срабатывания."}
], explain:"Tags Fired показывает сработавшие теги, Tags Not Fired — несработавшие, вкладка Variables — значения в этот момент."},
{id:"q113", type:"tf", q:"Верно ли: изменения в GTM начинают работать на сайте сразу после нажатия Save.", answer:false, explain:"Изменения живут в черновике, пока контейнер не опубликован кнопкой Submit. Preview показывает их только тебе."},
{id:"q114", type:"single", q:"Разработчик вставил только тот кусок кода GTM, который идёт в head. Что будет?", options:[
 {t:"В основном всё заработает, но потеряется часть данных от браузеров с отключённым JavaScript", ok:true, why:"Второй фрагмент в body — запасной вариант через noscript."},
 {t:"Ничего не заработает вообще", why:"Основной код в head достаточен для большинства посетителей."},
 {t:"GTM покажет ошибку установки", why:"Явной ошибки не будет, и в этом проблема."},
 {t:"Сайт перестанет загружаться", why:"На работу сайта это не влияет."}
], explain:"Типичная недоустановка. Не ломает всё, но тихо теряет часть данных — а это худший тип проблемы."},
{id:"q115", type:"single", q:"Зачем нужен data layer, если GTM умеет читать клики и страницы?", options:[
 {t:"Через него передаются данные, которых нет в вёрстке: сумма заказа, id товара, тип формы", ok:true, why:"Без этого невозможно передать ценность конверсии."},
 {t:"Он ускоряет загрузку контейнера", why:"К скорости отношения не имеет."},
 {t:"Он заменяет GA4", why:"Это транспорт данных, а не аналитика."},
 {t:"Он нужен только интернет-магазинам", why:"В лидогенерации через него передают тип формы и источник лида."}
], explain:"Вытаскивать сумму заказа из текста на странице — путь к поломке при первом же редизайне."},
{id:"q116", type:"multi", q:"Какое именование тегов в GTM рабочее? Отметь все приемлемые.", options:[
 {t:"GA4 — Form Submit", ok:true, why:"Видно платформу и назначение."},
 {t:"Ads — Conversion Lead", ok:true, why:"Понятно без открытия тега."},
 {t:"Meta — Pixel Base", ok:true, why:"Читается сразу."},
 {t:"Тег 2 копия", why:"Через полгода никто не вспомнит, что это."}
], explain:"Соглашение «платформа — тире — что делает» экономит часы при разборе чужого контейнера."}
]},

{ id:"m1l3", title:"GA4: настройка и ключевые события", blocks:[
{t:"p", x:"GA4 устроен не как старая аналитика. Здесь нет сессий как контейнеров — есть поток событий. Каждое действие на сайте это событие со своими параметрами."},
{t:"term", en:"Event", ru:"событие", d:"Любое зафиксированное действие: просмотр страницы, клик, отправка формы, прокрутка. Базовая единица данных в GA4."},
{t:"term", en:"Parameter", ru:"параметр события", d:"Дополнительная информация внутри события: какая страница, какая кнопка, какая сумма. Без параметров события почти бесполезны."},
{t:"term", en:"Key event", ru:"ключевое событие", d:"Событие, помеченное как важное для бизнеса. До 2024 года называлось conversion. Именно ключевые события импортируются в Google Ads."},
{t:"term", en:"Measurement ID", ru:"идентификатор потока данных", d:"Код вида G-XXXXXXXXXX, который связывает сайт с конкретным потоком данных в GA4."},
{t:"term", en:"Enhanced measurement", ru:"расширенная статистика", d:"Набор событий, которые GA4 собирает сам: просмотры страниц, прокрутка, исходящие клики, поиск по сайту, взаимодействие с видео, скачивание файлов."},

{t:"h", x:"Создание ресурса GA4"},
{t:"steps", title:"С нуля до Measurement ID", items:[
"Открыть <b>analytics.google.com</b>, войти под тем же рабочим аккаунтом.",
"Если аккаунтов ещё нет, появится мастер. Если есть — слева внизу шестерёнка <b>Admin</b>, затем <b>Create</b> → <b>Property</b>.",
"Ввести название ресурса, выбрать часовой пояс и валюту. <b>Валюту потом не поменять без потери данных</b> — ставь ту, в которой считает бизнес.",
"Ответить на вопросы о размере компании и целях — на функциональность не влияет.",
"На шаге <b>Data collection</b> выбрать платформу <b>Web</b>.",
"Ввести URL сайта и название потока, нажать <b>Create stream</b>.",
"Откроется карточка потока. Справа вверху — <b>Measurement ID</b> вида <code>G-XXXXXXXXXX</code>. Скопировать его и вставить в тег Google Tag в GTM из прошлого урока."
]},
{t:"path", label:"Вернуться к идентификатору позже", x:"Admin → Data collection and modification → Data streams → выбрать поток"},

{t:"h", x:"Проверка, что данные пошли"},
{t:"steps", title:"Две проверки подряд", items:[
"В GA4 открыть <b>Admin</b> → в колонке ресурса найти <b>DebugView</b>. Это окно реального времени для отладки.",
"Чтобы сайт попал в DebugView, он должен быть открыт в режиме Preview из GTM — тогда события помечаются отладочными автоматически.",
"Открыть сайт через GTM Preview, походить по страницам. В DebugView в течение 10–30 секунд появится поток событий.",
"Вторая проверка: отчёт <b>Reports</b> → <b>Realtime</b>. Там видно посетителей за последние 30 минут без режима отладки.",
"Стандартные отчёты наполняются с задержкой до 24 часов — не пугайся, что в первый день там пусто."
]},

{t:"h", x:"Отправка своего события из GTM"},
{t:"p", x:"Теперь настроим событие заявки для BrightFix. У сайта есть страница благодарности после отправки формы — это самый надёжный вариант, с него и начнём."},
{t:"steps", title:"Триггер на страницу благодарности", items:[
"В GTM: <b>Triggers</b> → <b>New</b> → <b>Trigger Configuration</b> → <b>Page View</b>.",
"Переключить на <b>Some Page Views</b>.",
"Задать условие: <code>Page URL</code> — <code>contains</code> — <code>/thank-you</code> (подставь реальный адрес страницы благодарности).",
"Назвать триггер <code>PV — Thank You</code>, сохранить.",
"Теперь тег: <b>Tags</b> → <b>New</b> → <b>Google Analytics: GA4 Event</b>.",
"В поле <b>Measurement ID</b> указать тот же <code>G-XXXXXXXXXX</code>.",
"В поле <b>Event Name</b> написать <code>generate_lead</code> — это стандартное имя события для заявки, Google его распознаёт.",
"Раскрыть <b>Event Parameters</b> и добавить параметр: имя <code>form_type</code>, значение <code>repair_request</code>. Так потом можно будет различать формы.",
"В блоке <b>Triggering</b> выбрать созданный <code>PV — Thank You</code>.",
"Назвать тег <code>GA4 — Lead</code>, сохранить.",
"Проверить в Preview: отправить форму на сайте, убедиться, что тег в Tags Fired и сработал один раз.",
"Опубликовать контейнер: <b>Submit</b> → описать версию («добавлен трекинг заявок») → <b>Publish</b>."
]},

{t:"h", x:"Пометка ключевого события"},
{t:"p", x:"Событие приходит в GA4, но пока это просто событие. Чтобы оно считалось конверсией и могло уехать в Google Ads, его нужно пометить."},
{t:"steps", title:"Отметить как key event", items:[
"В GA4 открыть <b>Admin</b> → в блоке <b>Data display</b> выбрать <b>Events</b>.",
"Найти в списке своё событие <code>generate_lead</code>. Оно появится там только после того, как придёт хотя бы один раз.",
"Справа в строке события включить переключатель <b>Mark as key event</b>.",
"Если события ещё нет в списке, его можно создать заранее: кнопка <b>Create event</b>, задать имя и условия, включить тот же переключатель.",
"Подождать: в стандартных отчётах ключевое событие появится в течение 24 часов."
]},
{t:"warn", x:"Не помечай как ключевое событие <code>page_view</code> или любое другое массовое событие. Алгоритмы начнут оптимизироваться на просмотры страниц. В GA4 действует лимит 30 ключевых событий на ресурс — это сделано именно чтобы останавливать такие порывы."},

{t:"h", x:"Отчёты, которые реально нужны"},
{t:"tab", head:["Отчёт","Где лежит","Зачем"], rows:[
["Traffic acquisition","Reports → Acquisition","Откуда приходят люди и что делают. Главный для рекламы"],
["Landing page","Reports → Engagement","Какие страницы принимают трафик и с какой конверсией"],
["Events","Reports → Engagement","Все события и их количество"],
["Explorations","Левое меню, иконка Explore","Конструктор произвольных отчётов"],
["DebugView","Admin → DebugView","Отладка в реальном времени"]
]},
{t:"ex", title:"Проверка аккаунта за 60 секунд", body:[
"Открыть <b>Reports → Acquisition → Traffic acquisition</b>, поставить период «вчера».",
"Найти строку <code>google / cpc</code>. Если её нет, а реклама крутится — связка аккаунтов или разметка настроены неверно.",
"Переключить колонку на ключевое событие и проверить, что у этой строки есть конверсии. Сессии есть, конверсий ноль — ломается слой ниже.",
"Эти две проверки делают в начале любого аудита. Занимают минуту, а находят проблему примерно в половине чужих аккаунтов."
]}
], quiz:[
{id:"q120", type:"single", q:"Где в GA4 пометить событие как ключевое?", options:[
 {t:"Admin → Data display → Events → переключатель Mark as key event", ok:true, why:"Основной путь, работает для уже приходящих событий."},
 {t:"Reports → Engagement → Events", why:"Там видно события, но пометить нельзя — это отчёт."},
 {t:"Admin → Data streams", why:"Там настройки потока и Measurement ID."},
 {t:"В настройках тега в GTM", why:"GTM только отправляет событие, статус задаётся в GA4."}
], explain:"До 2024 года это называлось conversion, сейчас key event. Механика та же: переключатель в строке события."},
{id:"q121", type:"single", q:"Событие настроено в GTM и срабатывает в Preview, но в списке Admin → Events его нет. Почему?", options:[
 {t:"Оно появится в списке только после того, как реально придёт в GA4 хотя бы раз", ok:true, why:"Список формируется из фактически полученных событий."},
 {t:"Нужно перезапустить контейнер GTM", why:"Перезапуск контейнера такой задачи не решает."},
 {t:"GA4 не поддерживает кастомные события", why:"Поддерживает, это основной механизм."},
 {t:"Нужно сначала пометить его ключевым", why:"Пометить можно только существующее в списке событие."}
], explain:"Если ждать не хочется, событие создаётся заранее через кнопку Create event."},
{id:"q122", type:"tf", q:"Верно ли: валюту ресурса GA4 можно без последствий поменять в любой момент.", answer:false, explain:"Смена валюты не пересчитывает уже собранные данные. Её ставят один раз при создании."},
{id:"q123", type:"single", q:"Почему нельзя помечать page_view как ключевое событие?", options:[
 {t:"Алгоритмы начнут оптимизироваться на просмотры страниц вместо реальных заявок", ok:true, why:"Сигнал полностью теряет связь с деньгами."},
 {t:"GA4 технически это запрещает", why:"Технически можно, и в этом опасность."},
 {t:"Это замедлит загрузку сайта", why:"К производительности отношения не имеет."},
 {t:"Нарушатся требования GDPR", why:"К согласию это отношения не имеет."}
], explain:"Лимит в 30 ключевых событий на ресурс существует именно чтобы ограничивать такие порывы."},
{id:"q124", type:"single", q:"Реклама крутится третий день, а в Traffic acquisition нет строки google / cpc. Что проверять первым?", options:[
 {t:"Связку Google Ads с GA4 и автопометку, а при ручной разметке — utm_medium", ok:true, why:"Платный трафик падает не туда именно из-за разметки или отсутствия связки."},
 {t:"Настройки ставок в кампании", why:"Ставки не влияют на классификацию визита."},
 {t:"Качество объявлений", why:"С отнесением трафика к каналу не связано."},
 {t:"Бюджет кампании", why:"Даже при малом бюджете визиты были бы видны."}
], explain:"Отсутствие канала при живой рекламе — всегда проблема разметки или связки аккаунтов."},
{id:"q125", type:"single", q:"Какое стандартное имя события лучше использовать для заявки в лидогенерации?", options:[
 {t:"generate_lead", ok:true, why:"Рекомендованное Google имя, распознаётся платформами."},
 {t:"zayavka", why:"Своё имя работать будет, но потеряется совместимость с готовыми отчётами."},
 {t:"page_view", why:"Это автоматическое событие просмотра страницы."},
 {t:"click", why:"Слишком общее, не отражает результат."}
], explain:"Стандартные имена событий — тот случай, когда следовать соглашению дешевле, чем изобретать своё."},
{id:"q126", type:"multi", q:"Что GA4 собирает автоматически при включённой enhanced measurement? Отметь все.", options:[
 {t:"Прокрутку страницы", ok:true, why:"Входит в стандартный набор."},
 {t:"Клики по внешним ссылкам", ok:true, why:"Исходящие клики отслеживаются автоматически."},
 {t:"Скачивание файлов", ok:true, why:"Тоже входит в набор."},
 {t:"Отправку формы как готовую конверсию", why:"Событие формы может собираться, но ключевым его надо пометить вручную, а надёжнее настроить свой триггер."}
], explain:"Автособираемое покрывает базу, но конверсии почти всегда требуют ручной настройки через GTM."},
{id:"q127", type:"single", q:"Где смотреть события в реальном времени при настройке?", options:[
 {t:"Admin → DebugView, открыв сайт через GTM Preview", ok:true, why:"Preview помечает события отладочными, и они попадают в DebugView."},
 {t:"Reports → Acquisition", why:"Стандартный отчёт, наполняется с задержкой."},
 {t:"Admin → Data streams", why:"Там настройки потока, а не поток событий."},
 {t:"Explorations", why:"Конструктор отчётов по историческим данным."}
], explain:"DebugView для отладки, Realtime для общей проверки живого трафика, стандартные отчёты — через сутки."}
]},

{ id:"m1l4", title:"UTM и разметка ссылок", blocks:[
{t:"p", x:"UTM — пометки в ссылке, по которым аналитика понимает, откуда пришёл человек. Технически элементарно, на практике именно здесь разваливается половина отчётов."},
{t:"term", en:"UTM parameters", ru:"UTM-метки", d:"Параметры в конце ссылки после знака вопроса. Считываются GA4 и большинством систем аналитики."},
{t:"f", x:"site.com/page?utm_source=facebook&utm_medium=paid_social&utm_campaign=spring_leadgen", note:"Первый параметр после ?, остальные через &"},
{t:"tab", head:["Параметр","Что означает","Примеры значений"], rows:[
["utm_source","Конкретная площадка","google, facebook, linkedin, newsletter"],
["utm_medium","Тип трафика","cpc, paid_social, email, referral, display"],
["utm_campaign","Название кампании","spring_leadgen_2026"],
["utm_content","Что именно кликнули","video_a, static_b, cta_header"],
["utm_term","Ключевое слово","обычно заполняется автоматически"]
]},

{t:"h", x:"Шесть правил, которые спасают отчёты"},
{t:"ul", items:[
"Только нижний регистр. <code>Facebook</code> и <code>facebook</code> для GA4 это два разных источника, и в отчёте будет две строки",
"Вместо пробелов подчёркивания. Пробел превратится в <code>%20</code> и испортит название",
"utm_medium берётся из закрытого списка: <code>cpc</code>, <code>paid_social</code>, <code>email</code>, <code>organic_social</code>, <code>referral</code>, <code>display</code>. Отсебятина ломает группировку каналов",
"Никогда не ставить UTM на внутренние ссылки сайта — это обнулит сессию и перезапишет источник",
"Название кампании в UTM должно совпадать с названием в рекламном кабинете",
"Не трогать кириллицу: в UTM только латиница, иначе ссылка превратится в нечитаемую строку"
]},

{t:"h", x:"Как собрать ссылку"},
{t:"steps", title:"Два способа", items:[
"<b>Вручную.</b> Взять адрес страницы, добавить <code>?</code>, затем параметры через <code>&</code>. Подходит, когда ссылок одна-две.",
"<b>Через Campaign URL Builder.</b> Загуглить «Google Campaign URL Builder», это бесплатный официальный инструмент. Заполняешь поля — получаешь готовую ссылку внизу страницы.",
"<b>Через таблицу.</b> Когда ссылок десятки: в Google Sheets колонки под каждый параметр и формула склейки. Это и есть рабочий способ в агентстве, заодно получается реестр всех ссылок.",
"Готовую ссылку всегда проверять: открыть её в браузере, убедиться, что страница загрузилась и в адресной строке метки на месте."
]},

{t:"h", x:"Google Ads размечать не надо"},
{t:"term", en:"Auto-tagging", ru:"автопометка", d:"Механизм Google Ads, который сам добавляет к ссылке параметр gclid. Работает надёжнее ручных UTM и включён по умолчанию."},
{t:"term", en:"GCLID", ru:"идентификатор клика Google", d:"Уникальный код клика, по которому Google связывает визит с кампанией, группой, объявлением и ключом. Основа для impорта офлайн-конверсий."},
{t:"path", label:"Проверить автопометку", x:"Google Ads → Admin → Account settings → Auto-tagging"},
{t:"p", x:"Ручные UTM нужны там, где у площадки нет своего механизма: email-рассылки, баннеры у партнёров, посты в соцсетях, QR-коды в офлайне, ссылки в подписи письма."},

{t:"h", x:"Соглашение об именовании"},
{t:"term", en:"Naming convention", ru:"соглашение об именовании", d:"Письменный документ, фиксирующий, как именуются кампании и UTM во всей команде. Скучная вещь, которая экономит десятки часов."},
{t:"ex", title:"Готовый шаблон для BrightFix", body:[
"Структура названия кампании и utm_campaign одинаковая: <code>канал_гео_услуга_цель_месяц</code>.",
"Примеры: <code>search_chicago_fridge_leads_2026-10</code>, <code>meta_chicago_washer_leads_2026-10</code>.",
"utm_content для Meta — тип креатива и номер: <code>ugc_01</code>, <code>static_03</code>, <code>video_02</code>.",
"Этот документ на одну страницу — <b>третий артефакт портфолио</b>. На собеседовании его показывают как доказательство, что ты умеешь работать в команде, а не только нажимать кнопки."
]},
{t:"warn", x:"Меняя UTM у работающей кампании, ты разрываешь историю: старые и новые визиты попадут в разные строки отчёта. Разметку договаривают один раз до запуска."}
], quiz:[
{id:"q130", type:"single", q:"Какой utm_medium правильный для рекламы в Meta?", options:[
 {t:"paid_social", ok:true, why:"Стандартное значение, GA4 корректно относит его к группе Paid Social."},
 {t:"facebook", why:"Это источник, его место в utm_source."},
 {t:"social media ads", why:"Пробелы недопустимы, и значение не из стандартного списка."},
 {t:"Paid_Social", why:"Заглавные буквы создадут отдельную строку в отчёте."}
], explain:"utm_source — площадка, utm_medium — тип трафика из закрытого списка."},
{id:"q131", type:"multi", q:"Что сломает отчётность? Отметь все.", options:[
 {t:"UTM на внутренней ссылке в меню сайта", ok:true, why:"Обнулит сессию и перезапишет источник."},
 {t:"Разный регистр в utm_source у разных объявлений", ok:true, why:"GA4 создаст несколько строк вместо одной."},
 {t:"Пробелы в utm_campaign", ok:true, why:"Превратятся в %20."},
 {t:"Использование utm_content для различения креативов", why:"Это правильное применение параметра."}
], explain:"Три частые ошибки, и все три лечатся одним документом с соглашением об именовании."},
{id:"q132", type:"single", q:"Нужно ли вручную размечать UTM для кампаний Google Ads?", options:[

 {t:"Нужно только для поисковых кампаний", why:"Автопометка работает для всех типов кампаний."}
], explain:"Ручная разметка нужна там, где своего механизма нет: рассылки, партнёры, посты, QR-коды."},
{id:"q133", type:"single", q:"Что такое gclid и зачем он нужен на практике?", options:[

 {t:"Идентификатор рекламного аккаунта", why:"Аккаунт обозначается Customer ID."},

], explain:"Сохранив gclid в CRM вместе с лидом, ты потом сообщишь Google, какие клики привели к сделкам."},

{id:"q135", type:"single", q:"Как правильно собрать UTM-ссылку для рассылки, если ссылок будет тридцать штук?", options:[

 {t:"Вручную по одной в блокноте", why:"Тридцать раз — это тридцать шансов опечататься."},
