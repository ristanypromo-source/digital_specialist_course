], explain:"Таблица со склейкой — рабочий способ в агентстве. Это ещё и готовая строчка в резюме."}
]},

{ id:"m1l5", title:"Конверсии в Google Ads и Meta", blocks:[
{t:"p", x:"GA4 видит, что произошло на сайте. Но чтобы алгоритм учился, конверсию нужно донести до самой платформы и сделать так, чтобы она смогла связать событие с конкретным человеком."},

{t:"h", x:"Google Ads: два пути"},
{t:"term", en:"Conversion action", ru:"конверсионное действие", d:"Настроенная в Google Ads цель. Импортируется из GA4 либо создаётся нативным тегом. Одно и то же действие нельзя считать обоими способами."},
{t:"path", label:"Где это лежит", x:"Google Ads → Goals → Conversions → Summary"},
{t:"steps", title:"Путь первый: импорт из GA4", items:[
"Сначала связать аккаунты: <b>Admin</b> → <b>Data manager</b> → найти Google Analytics 4 → <b>Link</b>, выбрать ресурс.",
"Перейти в <b>Goals</b> → <b>Conversions</b> → <b>Summary</b> → кнопка <b>New conversion action</b>.",
"Выбрать <b>Import</b> → <b>Google Analytics 4 properties</b> → <b>Web</b>.",
"В списке отметить своё ключевое событие <code>generate_lead</code>, нажать <b>Import and continue</b>.",
"Открыть импортированное действие и проверить настройки: <b>Goal</b> поставить Submit lead form, <b>Count</b> оставить One (для лидогенерации считается одна конверсия на человека), <b>Conversion window</b> по умолчанию 30 дней.",
"Самое важное — поле <b>Primary action for optimization</b>. Только отмеченные здесь действия участвуют в обучении ставок."
]},
{t:"steps", title:"Путь второй: нативный тег через GTM", items:[
"В Google Ads: <b>Goals</b> → <b>Conversions</b> → <b>Summary</b> → <b>New conversion action</b> → <b>Website</b>.",
"Ввести домен, нажать Scan. Google предложит варианты, но для надёжности выбирай <b>Add a conversion action manually</b>.",
"Задать категорию (Submit lead form), название, ценность и окно конверсии.",
"После сохранения открыть <b>Tag setup</b> → <b>Use Google Tag Manager</b>. Google покажет <b>Conversion ID</b> и <b>Conversion label</b>.",
"В GTM создать тег типа <b>Google Ads Conversion Tracking</b>, вставить туда оба значения и привязать к тому же триггеру, что и событие GA4.",
"Проверить в Preview, опубликовать контейнер."
]},
{t:"warn", x:"Не считай одно действие дважды: нативным тегом Google Ads и импортом того же события из GA4. Конверсии удвоятся, автоматика решит, что результат вдвое лучше, и начнёт переплачивать."},

{t:"term", en:"Enhanced conversions", ru:"улучшенные конверсии", d:"Передача хешированных first-party данных клиента вместе с событием конверсии. Google сопоставляет их со своими залогиненными пользователями и восстанавливает конверсии, которые иначе потерялись бы. Рекламодатели обычно видят рост учтённых конверсий на 5–15%."},
{t:"path", label:"Где включить", x:"Goals → Conversions → Settings → Enhanced conversions"},

{t:"h", x:"Meta: пиксель и серверная передача"},
{t:"term", en:"Meta Pixel", ru:"пиксель Meta", d:"Код на сайте, передающий события в Meta из браузера пользователя. Уязвим к блокировщикам и ограничениям браузеров."},
{t:"term", en:"CAPI — Conversions API", ru:"серверная передача конверсий", d:"Передача тех же событий с сервера, минуя браузер. В 2026 стандарт — держать Pixel и CAPI одновременно: браузерный и серверный потоки дополняют друг друга, Meta дедуплицирует события по общему идентификатору."},
{t:"term", en:"EMQ — Event Match Quality", ru:"качество сопоставления событий", d:"Оценка Meta от 1 до 10, показывающая, насколько хорошо она связывает твои события с реальными людьми. Ориентир — выше 7."},
{t:"steps", title:"Ставим пиксель через GTM", items:[
"Открыть <b>business.facebook.com</b> → в левом меню <b>Events Manager</b>.",
"Нажать <b>Connect data sources</b> → <b>Web</b> → <b>Connect</b>. Задать имя источника.",
"Выбрать способ установки <b>Install code manually</b> — скопировать базовый код пикселя.",
"В GTM создать тег типа <b>Custom HTML</b>, вставить код, триггер <b>All Pages</b>, назвать <code>Meta — Pixel Base</code>.",
"Для события заявки создать второй Custom HTML тег с кодом <code>fbq('track', 'Lead');</code> и привязать к триггеру страницы благодарности. Назвать <code>Meta — Lead</code>.",
"Проверить установку расширением <b>Meta Pixel Helper</b> для Chrome — оно показывает, какие события срабатывают на странице.",
"Вернуться в Events Manager → вкладка <b>Overview</b>: события должны появиться в течение нескольких минут."
]},
{t:"path", label:"Где смотреть EMQ", x:"Events Manager → выбрать источник → вкладка Overview → колонка Event Match Quality"},
{t:"p", x:"EMQ растёт от количества и качества переданных идентификаторов: email, телефон, имя, город — всё в хешированном виде. Увеличение бюджета на него не влияет никак."},

{t:"h", x:"Согласие и обратная связь"},
{t:"term", en:"Consent Mode v2", ru:"режим согласия", d:"Механизм, сообщающий тегам Google статус согласия пользователя. Юридически обязателен при показах в ЕЭЗ и Великобритании. Ключевой параметр — ad_storage."},
{t:"term", en:"Offline conversion import", ru:"импорт офлайн-конверсий", d:"Загрузка обратно в Google Ads данных о том, какие лиды стали сделками, по сохранённому gclid. Позволяет алгоритму оптимизироваться на деньги, а не на заявки."},
{t:"ex", title:"Цепочка для BrightFix целиком", body:[
"Человек кликает объявление → в ссылке приходит gclid → форма сохраняет его скрытым полем вместе с контактом → лид попадает в CRM с этим gclid → через неделю выезд оплачен → выгрузка сделок с gclid и суммой загружается обратно в Google Ads.",
"<b>Как загрузить:</b> Google Ads → <b>Goals</b> → <b>Conversions</b> → <b>Uploads</b> → загрузить CSV по шаблону Google либо настроить регулярную загрузку из Google Sheets.",
"С этого момента алгоритм оптимизируется не на количество заявок, а на выручку. Для BrightFix это означает, что система перестанет искать людей, которые звонят узнать цену и пропадают.",
"Это <b>главный приём, отличающий сильного лидогенщика</b>, и почти никто из джуниоров его не умеет."
]}

{id:"q145", type:"tf", q:"Верно ли: одно и то же действие можно одновременно считать нативным тегом Google Ads и импортом из GA4.", answer:false, explain:"Получится двойной учёт: алгоритм решит, что конверсий вдвое больше, и начнёт переплачивать."},

{id:"q147", type:"single", q:"Сайт показывает рекламу на ЕС, Consent Mode настроен неверно и ad_storage не передаётся. Что произойдёт?", options:[

{ id:"m2l2", title:"Собираем кампанию с нуля", blocks:[
{t:"p", x:"Самый практический урок модуля. Собираем поисковую кампанию для BrightFix по услуге «ремонт холодильников» в Чикаго. Открой свой аккаунт Google Ads и повторяй — читать про это бесполезно."},

{t:"h", x:"Шаг 1. Семантика в планировщике"},
{t:"term", en:"Keyword Planner", ru:"планировщик ключевых слов", d:"Бесплатный инструмент Google Ads: показывает объёмы запросов, прогноз цены клика и подбирает похожие ключи. Без запущенных кампаний показывает диапазоны вместо точных цифр."},
{t:"steps", title:"Собрать список ключей", items:[
"Перейти в <b>Tools</b> → <b>Planning</b> → <b>Keyword Planner</b>.",
"Выбрать <b>Discover new keywords</b>.",
"Ввести 3–5 стартовых фраз: <code>refrigerator repair</code>, <code>fridge repair service</code>, <code>appliance repair</code>.",
"Справа вверху задать регион Chicago и язык English — иначе объёмы будут по всему миру и бесполезны.",
"Нажать <b>Get results</b>. Появится таблица с объёмом запросов, уровнем конкуренции и диапазоном ставок.",
"Отсортировать по <b>Avg. monthly searches</b> и пройти список сверху вниз, отмечая галочками релевантные.",
"Сразу отбрасывать информационные запросы (<code>how to fix</code>, <code>diy</code>) и запросы про работу — их место в минус-словах.",
"Нажать <b>Download keyword ideas</b> и выгрузить в таблицу: там удобнее группировать."
]},
{t:"p", x:"Из планировщика берут не только ключи, но и <b>прогноз цены клика</b>. Это та самая цифра, которая нужна для медиаплана из модуля 0: зная CPC и конверсию сайта, ты считаешь ожидаемый CPL ещё до запуска."},

{t:"h", x:"Шаг 2. Группировка"},
{t:"p", x:"Ключи разбиваются на группы по смыслу. Правило простое: если на два ключа нужны разные объявления или разные страницы — это разные группы."},
{t:"ex", title:"Группировка для BrightFix", body:[
"<b>Группа «Fridge repair»:</b> refrigerator repair, fridge repair, refrigerator repair near me, refrigerator repair service.",
"<b>Группа «Washer repair»:</b> washing machine repair, washer repair service, washer repair near me.",
"<b>Группа «Emergency»:</b> same day appliance repair, emergency appliance repair, 24 hour appliance repair.",
"Каждая группа ведёт на свою страницу: первые две — на страницы под конкретную технику, третья — на страницу со срочным выездом. Это и есть message match из модуля 0."
]},
{t:"warn", x:"Не сваливай 200 ключей в одну группу. Тогда одно объявление пытается отвечать на все запросы сразу, релевантность падает, Quality Score тоже, и клик дорожает."},

{t:"h", x:"Шаг 3. Создание кампании"},
{t:"steps", title:"В интерфейсе", items:[
"<b>Campaigns</b> → синяя кнопка <b>+</b> → <b>New campaign</b>.",
"Выбрать цель <b>Leads</b>, затем тип кампании <b>Search</b>.",
"Отметить способ достижения цели: <b>Phone calls</b> и <b>Website visits</b>, указать номер и домен.",
"Название кампании — по своему соглашению: <code>search_chicago_fridge_leads_2026-10</code>.",
"<b>Bidding:</b> на старте без накопленных конверсий выбрать <b>Clicks</b> и поставить ограничение максимальной цены клика, чтобы не улететь в космос. После накопления конверсий переключишься.",
"<b>Networks:</b> снять галочки <b>Include Google Display Network</b> и <b>Include Google search partners</b>. Для чистого теста нужен только поиск.",
"<b>Locations:</b> ввести Chicago. Нажать <b>Location options</b> и выбрать <b>Presence: People in or regularly in your targeted locations</b> — иначе объявления увидят те, кто просто интересуется Чикаго из другого штата.",
"<b>Languages:</b> English.",
"<b>Budget:</b> дневной бюджет. Google умножает его на 30,4 для месячного лимита и может превышать дневной до двух раз в отдельные дни, компенсируя в другие.",
"Нажать <b>Next</b> и перейти к группам объявлений."
]},
{t:"warn", x:"Настройка Location options спрятана и по умолчанию стоит в режиме, включающем людей, «интересующихся» регионом. Для локального бизнеса это прямая утечка бюджета на другие города. Проверяй её в каждой новой кампании."},

{t:"h", x:"Шаг 4. Группы и ключи"},
{t:"steps", title:"Заполнение", items:[
"Назвать первую группу <code>Fridge repair</code>.",
"Вставить ключи списком, по одному на строку. Синтаксис соответствия задаётся прямо при вводе: <code>refrigerator repair</code> — широкое, <code>\"refrigerator repair\"</code> — фразовое, <code>[refrigerator repair]</code> — точное.",
"На старте рабочий вариант — фразовое плюс точное для основных ключей. Широкое добавляют позже, когда накопится конверсионный сигнал и будет чем его контролировать.",
"Нажать <b>Add ad group</b> и повторить для остальных групп."
]},

{
id:"m3", num:3, title:"Meta Ads в эпоху Andromeda", subtitle:"Переучивание: креатив вместо таргетинга", duration:"5 дней", pass:80,
intro:"Если ты уже запускал рекламу в Facebook, этот модуль частично про переучивание. Система Andromeda изменила принцип работы: аудиторию теперь определяет креатив, а не настройки таргетинга. Навык, который приносил результат в 2022-м, сегодня почти бесполезен, и на собеседовании это проверяют первым делом.",
lessons:[

{ id:"m3l1", title:"Что изменилось и почему старые приёмы не работают", blocks:[
{t:"p", x:"Раньше работа в Facebook Ads выглядела так: находишь правильные интересы, собираешь лукэлайки, дробишь на узкие группы, тестируешь аудитории. Креатив был вторичен. Сейчас всё наоборот, и понимание причины важнее запоминания новых настроек."},

{t:"term", en:"Andromeda", ru:"система доставки рекламы Meta", d:"Переработанная система подбора аудитории, полностью развёрнутая по большинству целей и плейсментов к октябрю 2025. Заменила таргетинг по аудиториям на таргетинг по креативу: алгоритм анализирует сам креатив, чтобы предсказать, кому его показать."},
{t:"f", x:"Было: ты говоришь кому показать → Стало: ты показываешь что, система решает кому", note:"Единица управления сместилась с настройки на материал"},

{t:"h", x:"Три следствия, которые меняют работу"},
{t:"tab", head:["Что было","Что стало"], rows:[
["Много групп с узкими интересами","Консолидация: меньше кампаний, больше данных на каждую"],
["Лукэлайки как главный рычаг","Система может их игнорировать, если предсказывает лучший результат"],
["3–5 креативов на группу","15–20 активных объявлений с разными хуками и форматами"],
["Детальный таргетинг под контролем","Advantage+ detailed targeting обязателен для ряда целей, отключить нельзя"],
["Пиксель достаточно","Pixel и CAPI одновременно, EMQ выше 7"]
]},
{t:"warn", x:"Advantage+ detailed targeting стал обязательным для ряда целей — максимум конверсий, события в приложении, клики по ссылке. Это значит, что система всё равно выйдет за рамки заданных интересов, если сочтёт нужным. Попытки «удержать» узкую аудиторию настройками в 2026 просто не работают."},

{t:"h", x:"Главный вывод"},
{t:"p", x:"Навык, который приносил ROAS в 2022-м, — настройка аудиторий. Навык, который приносит ROAS в 2026-м, — <b>производство креатива</b>. Если ты умеешь быстро выдавать много разных по смыслу креативов, ты ценен. Если умеешь только собирать аудитории, ты заменим интерфейсом."},
{t:"ex", title:"Что это значит для твоего резюме", body:[
"Строчка «настраивал таргетированную рекламу в Facebook» сегодня почти ничего не стоит — это умеет любой.",
"Работает другая формулировка: «веду аккаунты на 15–20 активных креативах, выстроил процесс производства и тестирования, настроил Pixel и CAPI с EMQ выше 7».",
"Это говорит нанимающему, что ты понимаешь, как система работает сейчас, а не три года назад."
]},

{t:"h", x:"Интерфейс: где что лежит"},
{t:"p", x:"Три разных инструмента, которые легко перепутать."},
{t:"tab", head:["Инструмент","Адрес","Для чего"], rows:[
["Ads Manager","adsmanager.facebook.com","Создание и управление кампаниями"],
["Events Manager","внутри Business Suite","Пиксель, CAPI, качество событий"],
["Business Settings","business.facebook.com/settings","Доступы, рекламные аккаунты, страницы, домены"]
]},
{t:"term", en:"Business Manager", ru:"бизнес-аккаунт Meta", d:"Контейнер, в котором живут рекламные аккаунты, страницы, пиксели и доступы сотрудников. Личный профиль используется только для входа, а всё рабочее должно лежать здесь — иначе при передаче проекта доступы не передать."},
{t:"warn", x:"Частая ошибка новичка и фрилансера: создать рекламный аккаунт в личном профиле, а не в Business Manager. Передать такой аккаунт клиенту невозможно, придётся создавать заново и терять всю накопленную историю обучения."},

{t:"h", x:"Структура кампании"},
{t:"tab", head:["Уровень","Что задаётся","Английское название"], rows:[
["Кампания","Цель, бюджет при CBO, Advantage+ режим","Campaign"],
["Группа объявлений","Аудитория, плейсменты, бюджет при ABO, оптимизация","Ad set"],
["Объявление","Креатив, текст, ссылка, призыв к действию","Ad"]
]},
{t:"term", en:"CBO — Campaign Budget Optimization", ru:"бюджет на уровне кампании", d:"Бюджет задаётся один на кампанию, система сама распределяет его между группами. В эпоху Andromeda это режим по умолчанию: он даёт алгоритму больше свободы и больше данных."},
{t:"term", en:"ABO — Ad Set Budget Optimization", ru:"бюджет на уровне группы", d:"Бюджет задаётся отдельно каждой группе. Нужен, когда требуется гарантированно открутить определённую сумму на конкретный сегмент — например, при тесте принципиально разных подходов."}
], quiz:[
{id:"q300", type:"single", q:"Что принципиально изменила система Andromeda?", options:[
 {t:"Аудиторию определяет креатив, а не настройки таргетинга", ok:true, why:"Алгоритм анализирует сам материал, чтобы предсказать, кому его показать."},
 {t:"Реклама стала дороже", why:"Цена зависит от аукциона, а не от этой системы."},
 {t:"Исчезли группы объявлений", why:"Структура осталась трёхуровневой."},
 {t:"Пиксель больше не нужен", why:"Наоборот, качество сигнала стало важнее."}
], explain:"Единица управления сместилась с настройки на материал. Это главная мысль модуля."},
{id:"q301", type:"single", q:"Сколько активных объявлений рекомендуется держать в работе по логике Andromeda?", options:[
 {t:"15–20 с разными хуками и форматами", ok:true, why:"Разнообразие креатива стало основным рычагом."},
 {t:"1–2, чтобы не размывать бюджет", why:"Подход из эпохи, когда решал таргетинг."},
 {t:"3–5, классический вариант", why:"Было стандартом раньше, сейчас недостаточно."},
 {t:"50 и больше", why:"Избыточно: бюджет размажется, данных на креатив не хватит."}
], explain:"Важно именно разнообразие по смыслу, а не 20 вариантов одной картинки с разным фоном."},
{id:"q302", type:"tf", q:"Верно ли: Advantage+ detailed targeting можно отключить для любой цели кампании.", answer:false, explain:"Для ряда целей — максимум конверсий, события в приложении, клики по ссылке — он обязателен и отключить его нельзя."},
{id:"q303", type:"single", q:"Почему нельзя создавать рекламный аккаунт в личном профиле?", options:[
 {t:"Его невозможно передать клиенту, придётся создавать заново и терять историю обучения", ok:true, why:"Всё рабочее должно жить в Business Manager."},
 {t:"Meta блокирует такие аккаунты", why:"Не блокирует, но работать с ними неудобно."},
 {t:"В нём нельзя запускать конверсионные кампании", why:"Технически можно."},
 {t:"Там выше цена клика", why:"На аукцион тип аккаунта не влияет."}
], explain:"Типичная ошибка фрилансера, из-за которой потом приходится начинать с нуля."},
{id:"q304", type:"single", q:"В каком случае применяют ABO вместо CBO?", options:[
 {t:"Когда нужно гарантированно открутить определённую сумму на конкретный сегмент", ok:true, why:"Например, при тесте принципиально разных подходов."},
 {t:"Всегда, CBO устарел", why:"CBO сейчас режим по умолчанию."},
 {t:"Когда бюджет меньше $50 в день", why:"Размер бюджета не определяет выбор."},
 {t:"Когда в кампании одна группа", why:"При одной группе разницы практически нет."}
], explain:"CBO по умолчанию даёт алгоритму больше свободы, ABO — для контролируемых тестов."},
{id:"q305", type:"multi", q:"Какие формулировки в резюме работают в 2026? Отметь все.", options:[
 {t:"Веду аккаунты на 15–20 активных креативах", ok:true, why:"Показывает понимание текущей механики."},
 {t:"Настроил Pixel и CAPI, держу EMQ выше 7", ok:true, why:"Конкретный технический навык."},
 {t:"Выстроил процесс производства и тестирования креативов", ok:true, why:"Главный дефицитный навык."},
 {t:"Настраивал таргетированную рекламу в Facebook", why:"Общая фраза, которую пишут все; ничего не говорит о квалификации."}
], explain:"Конкретика про креатив и сигнал отличает кандидата, который следит за изменениями."}
]},

{ id:"m3l2", title:"Собираем кампанию: от цели до запуска", blocks:[
{t:"p", x:"Собираем лидогенерационную кампанию для BrightFix. Открывай Ads Manager и повторяй."},

{t:"h", x:"Шаг 1. Цель"},
{t:"path", label:"Начало", x:"adsmanager.facebook.com → зелёная кнопка Create → выбрать цель"},
{t:"tab", head:["Цель","Когда выбирать"], rows:[
["Leads","Заявки: через форму на сайте или лидформу внутри Meta"],
["Sales","Покупки в интернет-магазине"],
["Traffic","Переходы на сайт. Для лидогенерации почти никогда — приводит кликеров"],
["Awareness","Охват. Для малого бизнеса обычно пустая трата"],
["Engagement","Сообщения, подписки, реакции"]
]},
{t:"warn", x:"Самая частая ошибка новичка — выбрать Traffic, потому что «нужны люди на сайте». Система начнёт искать тех, кто охотно кликает, а не тех, кто оставляет заявки. Для BrightFix правильная цель — Leads, даже если заявок пока мало."},

{t:"h", x:"Шаг 2. Уровень кампании"},
{t:"steps", title:"Настройки", items:[

"<b>Special ad categories</b> — оставить пустым. Отмечают только для кредитов, жилья, работы и политики; эти категории сильно ограничивают таргетинг.",
"<b>Campaign budget optimization</b> — включить. Задать дневной бюджет на кампанию.",
"Нажать <b>Next</b>."
]},

{t:"h", x:"Шаг 3. Группа объявлений"},
{t:"steps", title:"Что настраивать и что не трогать", items:[
"<b>Conversion location</b> — Website, если форма на сайте; Instant forms, если лидформа внутри Meta.",
"<b>Performance goal</b> — Maximize number of conversions. Ниже выбрать конверсионное событие: <code>Lead</code>.",
"<b>Audience:</b> задать только гео (Chicago), возраст и язык. <b>Интересы не добавлять.</b> Это главное отличие от старого подхода: широкая аудитория даёт системе пространство для работы.",
"В блоке <b>Advantage+ audience</b> оставить включённым. Поля интересов, если они доступны, работают теперь как подсказка, а не как ограничение.",
"<b>Placements</b> — оставить Advantage+ placements. Ручной отбор плейсментов почти всегда ухудшает результат, потому что сужает аукцион.",
"Проверить, что внизу указано верное событие конверсии и верный источник данных (пиксель).",
"Нажать <b>Next</b>."
]},
{t:"p", x:"Обрати внимание, насколько коротким стал этот шаг. Раньше здесь проходила основная работа, сейчас — две минуты. Освободившееся время уходит на следующий шаг."},

{t:"h", x:"Шаг 4. Объявления"},
{t:"steps", title:"Загрузка креативов", items:[
"Выбрать страницу Facebook и аккаунт Instagram, от имени которых показывается реклама.",
"<b>Ad setup</b> — выбрать формат: Single image or video, Carousel или Collection.",
"Загрузить креатив. Для первого объявления — лучший из имеющихся.",
"<b>Primary text</b> — основной текст. Первые две строки видны до кнопки «ещё», поэтому главное говорят сразу.",
"<b>Headline</b> — короткий заголовок под картинкой.",
"<b>Call to action</b> — выбрать подходящую кнопку: Learn More, Get Quote, Book Now.",
"<b>Website URL</b> — ссылка с UTM-метками по твоему соглашению.",
"Нажать <b>Publish</b>.",
"Дальше дублировать объявление и менять креатив: <b>три точки на объявлении → Duplicate</b>. Так за полчаса набирается 15 объявлений в одной группе."

{t:"warn", x:"Все креативы кладут в <b>одну группу объявлений</b>, а не по одному в разные. Дробление лишает систему данных: ей нужно сравнивать варианты внутри общего пула, а не угадывать между изолированными группами."},

{t:"h", x:"Шаг 5. Что делать после запуска"},
{t:"term", en:"Learning phase", ru:"фаза обучения", d:"Период после запуска, когда система набирает данные. Выход из неё обычно требует порядка 50 конверсионных событий на группу за неделю. До выхода результаты нестабильны."},
{t:"ul", items:[
"Первые 3–4 дня <b>не трогать ничего</b>. Любое изменение бюджета, аудитории или креатива перезапускает обучение",
"Не делать выводов по первому дню: цена заявки в первые сутки почти всегда выше итоговой",
"Если через неделю группа не вышла из обучения — вероятно, бюджет слишком мал для выбранного события, либо событие слишком редкое",
"Правило изменения бюджета: не больше 20–30% за раз, иначе обучение стартует заново"
]},
{t:"ex", title:"Расчёт минимального бюджета", body:[
"Для выхода из обучения нужно порядка 50 событий в неделю на группу.",
"Если ожидаемая цена заявки для BrightFix около $25, то бюджет группы должен быть порядка 50 × 25 = <b>$1 250 в неделю</b>, то есть около $180 в день.",
"Если у клиента есть только $60 в день, честный разговор звучит так: «на этом бюджете группа не выйдет из обучения по событию «заявка», поэтому мы оптимизируемся на более частое событие — например, начало заполнения формы — и примем, что качество будет ниже».",
"Умение произвести этот расчёт вслух на собеседовании производит очень сильное впечатление."
]}
], quiz:[
{id:"q310", type:"single", q:"Нужны заявки на ремонт техники. Какую цель кампании выбрать?", options:[
 {t:"Leads", ok:true, why:"Система будет искать людей, склонных оставлять заявки."},
 {t:"Traffic", why:"Приведёт кликеров: система ищет тех, кто охотно кликает, а не оставляет заявки."},
 {t:"Awareness", why:"Охватная цель, к заявкам отношения не имеет."},
 {t:"Engagement", why:"Оптимизирует реакции и сообщения, а не заявки."}
], explain:"Выбор Traffic вместо Leads — самая частая и самая дорогая ошибка новичка."},
{id:"q311", type:"single", q:"Как настраивать аудиторию в лидогенерационной кампании в 2026?", options:[
 {t:"Только гео, возраст и язык; интересы не добавлять", ok:true, why:"Широкая аудитория даёт системе пространство для работы."},
 {t:"Собрать 10–15 узких интересов по теме", why:"Подход из эпохи до Andromeda, сейчас только мешает."},
 {t:"Использовать только лукэлайки", why:"Система может их игнорировать, если предсказывает лучший результат."},
 {t:"Максимально сузить до 50 тысяч человек", why:"Узкая аудитория ограничивает алгоритм и разгоняет частоту."}
], explain:"Настройка аудитории стала двухминутной задачей. Освободившееся время уходит на креатив."},
{id:"q312", type:"num", q:"Сколько конверсионных событий в неделю на группу обычно нужно для выхода из фазы обучения?", unit:"событий", answer:50, tol:0.5, hint:"Круглое число, которое называют во всех руководствах Meta.", explain:"Порядка 50 событий в неделю. Ниже этого система не набирает достаточно данных."},
{id:"q313", type:"num", q:"Ожидаемая цена заявки $25. Какой минимальный недельный бюджет группы нужен для выхода из обучения?", unit:"$", answer:1250, tol:20, hint:"Нужное число событий умножить на цену события.", explain:"50 × 25 = $1 250 в неделю, около $180 в день. Если бюджета столько нет, оптимизируются на более частое событие."},
{id:"q314", type:"single", q:"Куда загружать 15 креативов?", options:[
 {t:"Все в одну группу объявлений", ok:true, why:"Системе нужно сравнивать варианты внутри общего пула."},
 {t:"По одному в 15 отдельных групп", why:"Дробление лишает систему данных и размазывает бюджет."},
 {t:"По три в пять групп", why:"Та же проблема в меньшем масштабе."},
 {t:"В разные кампании", why:"Ещё сильнее изолирует данные."}
], explain:"Консолидация — одно из трёх главных правил эпохи Andromeda."},
{id:"q315", type:"single", q:"Запустили кампанию вчера, цена заявки вдвое выше плановой. Что делать?", options:[
 {t:"Ничего, идёт фаза обучения; выводы делают минимум через 3–4 дня", ok:true, why:"В первые сутки цена почти всегда выше итоговой."},
 {t:"Срочно снизить бюджет вдвое", why:"Перезапустит обучение и ухудшит ситуацию."},
 {t:"Поменять аудиторию", why:"Любое изменение сбрасывает накопленные данные."},
 {t:"Отключить кампанию", why:"Решение по одному дню данных."}
], explain:"Терпение в первые дни — профессиональный навык. Правка настроек каждый день держит кампанию в вечном обучении."},
{id:"q316", type:"single", q:"Насколько можно менять бюджет группы, не сбрасывая обучение?", options:[
 {t:"Не больше чем на 20–30% за раз", ok:true, why:"Более резкие изменения перезапускают фазу обучения."},
 {t:"На любую величину, это не влияет", why:"Влияет напрямую."},
 {t:"Только вдвое и только вверх", why:"Удвоение как раз сбросит обучение."},
 {t:"Бюджет вообще нельзя менять после запуска", why:"Можно, просто постепенно."}
], explain:"Правило 20–30% за раз, с паузой на стабилизацию между шагами."},
{id:"q317", type:"single", q:"Стоит ли вручную отбирать плейсменты?", options:[
 {t:"Почти никогда: ручной отбор сужает аукцион и обычно ухудшает результат", ok:true, why:"Advantage+ placements — рабочий вариант по умолчанию."},
 {t:"Да, всегда оставлять только Instagram Stories", why:"Произвольное сужение без данных."},
 {t:"Да, обязательно отключать Audience Network", why:"Распространённый миф; система сама распределит, если сигнал настроен."},
 {t:"Да, если бюджет меньше $100 в день", why:"Размер бюджета не повод сужать аукцион."}
], explain:"Чем шире аукцион, тем больше у системы вариантов найти дешёвую конверсию."}
]},

{ id:"m3l3", title:"Креатив: главный рычаг", blocks:[
{t:"p", x:"Раз аудиторию определяет креатив, то производство креатива и есть основная работа. Это и хорошая, и плохая новость: хорошая — рычаг в твоих руках; плохая — халтурить больше не получится."},

{t:"h", x:"Что считается разнообразием"},
{t:"term", en:"Creative diversity", ru:"разнообразие креатива", d:"Насколько по-настоящему разные материалы работают в кампании. Считается по смыслу, а не по количеству файлов."},
{t:"warn", x:"Фальшивое разнообразие — 20 вариантов одной картинки с разным цветом фона или переставленным текстом. Для системы это один креатив. Настоящее разнообразие — разные <b>углы подачи</b>, разные форматы, разные первые три секунды."},
{t:"term", en:"Hook", ru:"хук, первые секунды", d:"То, что останавливает прокрутку. В видео — первые 1–3 секунды, в статике — главный визуальный элемент и первая строка текста. Решает, увидят ли остальное вообще."},
{t:"term", en:"Angle", ru:"угол подачи", d:"Смысловой подход к одному и тому же продукту: боль, выгода, срочность, социальное доказательство, возражение, сравнение. Разные углы цепляют разных людей."},

{t:"h", x:"Шесть углов для BrightFix"},
{t:"tab", head:["Угол","Пример хука"], rows:[
["Боль","«Холодильник потёк ночью — и что теперь?»"],
["Срочность","«Мастер у вас сегодня до 18:00»"],
["Цена и прозрачность","«Фиксированная цена до начала работ. Никаких сюрпризов в счёте»"],
["Социальное доказательство","«900 отзывов, средняя 4,8 — вот почему»"],
["Возражение","«Думаете, дешевле купить новый? Посчитаем вместе»"],
["Процесс","«Как проходит ремонт: от звонка до работающей техники за 3 часа»"]
]},
{t:"p", x:"Шесть углов × два-три формата каждый = 15–18 объявлений. Это и есть нужный объём, и он собирается за один рабочий день."},

{t:"h", x:"Форматы, которые надо уметь делать"},
{t:"ul", items:[
"<b>UGC-видео</b> — съёмка «как от обычного человека», вертикально, с телефона. Главный рабочий формат 2026 года",
"<b>Статика с текстом</b> — быстро производится, хорошо работает в ленте",
"<b>Скриншот-формат</b> — отзыв, переписка, экран приложения. Выглядит как контент, а не реклама",
"<b>Карусель</b> — для процессов, сравнений и нескольких услуг",
"<b>Видео до/после</b> — для всего, где виден результат"
]},

{t:"h", x:"Как это производить без бюджета на продакшн"},
{t:"steps", title:"Рабочий конвейер", items:[
"Написать 6 углов и к каждому по 2–3 варианта хука. Это текстовая работа, делается в таблице за час.",
"Для статики — <b>Canva</b> в бесплатной версии. Один шаблон под вертикаль 1080×1350, дальше только меняешь текст и фон.",
"Для видео — <b>CapCut</b>, бесплатен. Вертикаль 9:16, субтитры обязательны: большинство смотрит без звука.",
"Исходники для UGC — снимает сам клиент на телефон либо берутся со стоков. Для теста идеальное качество не нужно.",
"AI помогает с текстами хуков и описаний, но итоговый отбор за тобой: модель выдаёт компетентный средний текст, а цепляет обычно конкретная деталь, которую знаешь только ты.",
"Именовать файлы по системе: <code>fridge_pain_ugc_01</code>, <code>fridge_urgency_static_02</code>. Иначе через месяц не поймёшь, что сработало."
]},
{t:"warn", x:"Субтитры на видео — не опция. Значительная часть людей смотрит ленту без звука, и видео без текста для них просто немая картинка."},

{t:"h", x:"Чтение отчётов на уровне креатива"},
{t:"path", label:"Где смотреть", x:"Ads Manager → вкладка Ads (третья, после Campaigns и Ad sets) → Columns → Performance and clicks"},
{t:"p", x:"Анализ ведётся на уровне объявлений, а не кампаний. Кампания — это среднее по больнице, которое ничего не говорит о том, что делать дальше."},
{t:"tab", head:["Симптом","Что означает","Действие"], rows:[

["Высокий CTR, низкий CVR","Обещание в креативе не совпадает с посадочной","Чинить message match"],
["Частота выше 3 за неделю","Аудитория устала, начинается выгорание","Добавлять новые креативы"],
["CPM растёт при стабильном CTR","Рост конкуренции или сужение аудитории","Проверить аудиторию, расширить"],
["Один креатив забрал весь бюджет","Нормально для CBO, если он эффективен","Не трогать, но готовить замену"]
]},
{t:"term", en:"Creative fatigue", ru:"выгорание креатива", d:"Падение эффективности от того, что аудитория видела материал слишком много раз. Первые признаки: рост частоты, рост CPM, падение CTR при неизменных настройках."},
{t:"ex", title:"Ритм обновления", body:[
"Рабочий темп для небольшого аккаунта — <b>3–5 новых креативов в неделю</b>, добавляемых в ту же группу.",
"Старые не удаляют, а отключают, если они перестали получать показы. История обучения сохраняется.",
"Этот ритм — то, что реально спрашивают на собеседовании формулировкой «как вы боретесь с выгоранием»."
]}
], quiz:[
{id:"q320", type:"single", q:"Что считается настоящим разнообразием креатива?", options:[
 {t:"Разные углы подачи, форматы и первые секунды", ok:true, why:"Система оценивает смысл материала, а не количество файлов."},
 {t:"20 вариантов одной картинки с разным цветом фона", why:"Для системы это один креатив."},
 {t:"Один креатив в 20 разных группах", why:"Это дробление, а не разнообразие."},
 {t:"Одно видео с разной длительностью", why:"Смысл и хук не меняются."}
], explain:"Фальшивое разнообразие — самая частая попытка срезать угол, и она не работает."},
{id:"q321", type:"single", q:"CTR объявления высокий, а конверсий почти нет. Что чинить?", options:[
 {t:"Соответствие обещания в креативе содержанию посадочной страницы", ok:true, why:"Классический разрыв message match."},
 {t:"Хук в первых секундах", why:"Хук как раз работает — люди кликают."},
 {t:"Бюджет группы", why:"Бюджет не влияет на поведение после клика."},
 {t:"Плейсменты", why:"Проблема возникает после перехода, а не на показе."}
], explain:"Высокий CTR означает, что креатив цепляет. Потеря происходит дальше."},
{id:"q322", type:"single", q:"Частота выросла до 4,2 за неделю, CTR падает, CPM растёт. Что это?", options:[
 {t:"Выгорание креатива — пора добавлять новые", ok:true, why:"Классический набор признаков."},
 {t:"Поломка пикселя", why:"Трекинг на частоту и CPM не влияет."},
 {t:"Слишком большой бюджет", why:"Бюджет мог ускорить выгорание, но причина в материале."},
 {t:"Google изменил алгоритм", why:"Речь о Meta, и дело не в алгоритме."}
], explain:"Рост частоты плюс рост CPM плюс падение CTR — учебный признак усталости аудитории."},
{id:"q323", type:"multi", q:"Что входит в рабочий конвейер производства креативов без бюджета? Отметь все.", options:[
 {t:"Canva для статики по одному шаблону", ok:true, why:"Бесплатна, достаточна для теста."},
 {t:"CapCut для вертикальных видео с субтитрами", ok:true, why:"Бесплатен, субтитры обязательны."},
 {t:"Система именования файлов по углу и формату", ok:true, why:"Иначе невозможно понять, что сработало."},
 {t:"Профессиональная видеосъёмка в студии", why:"Для теста избыточно: UGC-формат работает лучше и стоит ноль."}
], explain:"Главный ресурс здесь — не деньги, а дисциплина и система."},
{id:"q324", type:"tf", q:"Верно ли: субтитры на рекламных видео — необязательная деталь.", answer:false, explain:"Значительная часть аудитории смотрит ленту без звука. Видео без субтитров для них немая картинка."},
{id:"q325", type:"single", q:"На каком уровне нужно анализировать результаты в Meta?", options:[
 {t:"На уровне объявлений, во вкладке Ads", ok:true, why:"Кампания — среднее, которое не говорит, что делать дальше."},

 {t:"Только на уровне групп", why:"Та же проблема в меньшем масштабе."},

], explain:"Раз креатив стал главным рычагом, то и анализ ведётся на его уровне."},
{id:"q326", type:"num", q:"Шесть углов подачи, по 2–3 формата на каждый. Сколько примерно объявлений получится?", unit:"объявлений", answer:15, tol:3, hint:"Перемножь и округли в нижнюю сторону диапазона.", explain:"6 × 2,5 ≈ 15 объявлений — ровно тот объём, который рекомендуется держать активным."},
{id:"q327", type:"single", q:"Какой темп обновления креативов считается рабочим для небольшого аккаунта?", options:[
 {t:"3–5 новых в неделю, добавляемых в ту же группу", ok:true, why:"Поддерживает пул свежим без сброса обучения."},
 {t:"Полная замена всех креативов раз в месяц", why:"Обнулит накопленные данные разом."},
 {t:"Один новый раз в квартал", why:"Выгорание наступит гораздо раньше."},
 {t:"20 новых каждую неделю", why:"Нереалистично и размоет бюджет."}
], explain:"«Как вы боретесь с выгоранием» — стандартный вопрос собеседования, и ответ про ритм работает лучше теории."}
]},

{ id:"m3l4", title:"Лидформы, аудитории и масштабирование", blocks:[
{t:"p", x:"Три практические темы, которые встречаются в каждом лидогенерационном аккаунте."},

{t:"h", x:"Instant forms: заявка без ухода с платформы"},
{t:"term", en:"Instant form", ru:"лидформа внутри Meta", d:"Форма, открывающаяся прямо в приложении, без перехода на сайт. Поля частично заполняются из профиля, поэтому конверсия в заявку в разы выше, чем на сайте."},
{t:"p", x:"Обратная сторона — качество. Заполнить такую форму в два касания слишком легко, и доля случайных заявок выше. Поэтому в ней есть настройка, которая прямо управляет этим балансом."},
{t:"path", label:"Где создаётся", x:"Ads Manager → уровень Ad → блок Instant form → Create form"},
{t:"steps", title:"Настройка формы для BrightFix", items:[
"<b>Form type</b> — выбрать <b>Higher intent</b> вместо More volume. Это добавляет экран подтверждения перед отправкой и заметно повышает качество заявок.",
"<b>Intro</b> — заголовок и короткое описание. Здесь честно сказать, что будет дальше: «Перезвоним в течение 15 минут и назовём точную цену».",
"<b>Questions</b> — минимум полей. Имя, телефон и один уточняющий вопрос. Каждое лишнее поле режет конверсию.",
"Добавить <b>custom question</b> с выбором: «Какая техника сломалась?» — холодильник, стиральная машина, посудомоечная, другое. Это и квалифицирует лида, и даёт данные для отчёта.",
"<b>Privacy policy</b> — обязательна ссылка на политику конфиденциальности, без неё форма не сохранится.",
"<b>Completion</b> — экран после отправки. Добавить кнопку звонка: часть людей позвонит сразу, и это лучшие лиды.",
"Проверить, куда попадают заявки. Без интеграции они лежат в Meta и их надо выгружать вручную — это худший сценарий."
]},
{t:"path", label:"Выгрузка заявок вручную", x:"Business Suite → All tools → Instant Forms → выбрать форму → Download"},
{t:"warn", x:"Заявка, пролежавшая в кабинете сутки, почти мертва. В сервисных нишах решение принимают за минуты. Либо настраивается интеграция с CRM, либо кто-то проверяет формы несколько раз в день — третьего не дано, и это обязательно проговаривается с клиентом до запуска."},

{t:"path", label:"Где создаются", x:"Campaigns → выбрать группу объявлений → Ads → + → Responsive search ad"},

{t:"path", label:"Где добавлять", x:"Campaigns → Ads and assets → Assets → + → выбрать тип ассета → уровень Campaign или Ad group"},
{t:"steps", title:"Минимальный набор для сервисного бизнеса", items:[
"<b>Sitelinks</b> — минимум четыре, лучше шесть. Каждый с описанием из двух строк. Для BrightFix: «Ремонт холодильников», «Ремонт стиральных машин», «Цены на выезд», «Отзывы клиентов», «Зона обслуживания», «Срочный выезд сегодня».",
"<b>Callouts</b> — минимум четыре коротких фразы без ссылок: «Выезд в день обращения», «Гарантия 12 месяцев», «Фиксированная цена», «Работаем 7 дней».",
"<b>Structured snippets</b> — список по заданной категории. Для сервиса подойдёт тип Services: холодильники, стиральные машины, посудомоечные, духовые шкафы.",
"<b>Call asset</b> — номер телефона прямо в объявлении. Для сервисного бизнеса обязателен: значительная часть людей звонит, а не заполняет форму.",
"<b>Location asset</b> — подтягивается из Google Business Profile, показывает адрес и расстояние.",
"<b>Image asset</b> — квадратное изображение рядом с объявлением. Часто забывают, а оно заметно увеличивает площадь."
]},

{t:"h", x:"Проверка перед публикацией"},
{t:"steps", title:"Чек-лист объявления", items:[
"Ключевая фраза группы присутствует минимум в трёх заголовках.",
"Нет двух заголовков с одинаковым смыслом.",
"Заголовки используют почти всю длину: 25–30 символов, а не 12.",
"Есть минимум три проверяемых факта: срок, гарантия, цифра, лицензия.",
"Ни одной фразы, которую мог бы написать любой конкурент.",
"Есть призыв к действию с понятной ценой действия.",
"Ссылка ведёт на страницу, где заголовок повторяет обещание объявления.",
"Индикатор <b>Ad strength</b> показывает Good или Excellent — он не KPI, но Poor обычно означает реальную недоработку."
]},
{t:"term", en:"Ad strength", ru:"эффективность объявления", d:"Индикатор Google, оценивающий количество и разнообразие заготовок. Не влияет на аукцион напрямую и не является целью, но Poor почти всегда означает мало заголовков или дублирующиеся формулировки."},

{t:"h", x:"Как это делается быстро"},
{t:"p", x:"На живом проекте объявления пишут не по одному, а пачками в таблице, потом загружают через <b>Google Ads Editor</b> — бесплатную программу для массовой работы с аккаунтом. Пятнадцать объявлений загружаются за одну операцию вместо часа кликов в интерфейсе."},
{t:"ex", title:"AI в написании объявлений", body:[
"Что получается хорошо: выдать 30 вариантов заголовка под заданный угол, переписать под лимит символов, собрать комбинации ключа и выгоды, проверить тексты на повторы.",
"Что получается плохо: придумать конкретику, которой ты не дал. Модель напишет «Высокое качество обслуживания», потому что не знает про гарантию 12 месяцев и 900 отзывов.",
"<b>Рабочий порядок:</b> сначала сам собираешь факты из источников, потом просишь модель оформить их в 15 заголовков по структуре выше, потом вычёркиваешь всё, что прошло мимо теста на мусор. Экономия примерно вдвое, но не замена первого шага."
]}

{ id:"m4l3", title:"Креатив для Meta: от угла до файла", blocks:[
{t:"p", x:"В Meta креатив определяет, кому покажут объявление. Поэтому производство креатива — не этап перед запуском, а постоянный процесс, который не останавливается никогда."},

{t:"h", x:"Шаг 1. Матрица углов"},
{t:"p", x:"Начинается всё не с картинки, а с таблицы. Шесть углов подачи, по два-три хука на каждый — получается 15–18 концепций, то есть ровно нужный объём."},
{t:"tab", head:["Угол","Логика","Хук для BrightFix"], rows:[
["Боль","Назвать неприятную ситуацию","«Холодильник потёк ночью. Что делать до приезда мастера»"],
["Срочность","Снять тревогу о сроках","«Мастер у вас сегодня до 18:00»"],
["Цена и прозрачность","Снять страх обмана","«Цена фиксируется до начала работ. В счёте ровно столько же»"],
["Доказательство","Снять недоверие","«900 отзывов, средняя 4,8. Вот за что их ставят»"],
["Возражение","Ответить на внутренний спор","«Думаете, дешевле купить новый? Посчитаем вместе»"],
["Процесс","Снять неизвестность","«От звонка до работающей техники: три часа, показываем как»"]
]},
{t:"warn", x:"Шесть углов — это шесть разных причин, по которым человек откликнется. Двадцать вариантов одного угла с разным фоном для системы остаются одним креативом."},

{t:"h", x:"Шаг 2. Форматы"},
{t:"tab", head:["Формат","Когда применять","Сложность производства"], rows:[
["UGC-видео","Главный рабочий формат 2026. Вертикаль, съёмка с телефона","Средняя: нужен человек в кадре"],
["Статика с текстом","Быстрый тест угла, хорошо работает в ленте","Низкая: Canva, 15 минут"],
["Скриншот-формат","Отзыв, переписка, экран приложения. Выглядит как контент","Низкая"],
["Карусель","Процессы, сравнения, несколько услуг","Средняя"],
["До и после","Всё, где виден результат","Низкая, если есть материал"]
]},

{t:"h", x:"Шаг 3. Производство"},
{t:"steps", title:"Конвейер без бюджета на продакшн", items:[
"Завести таблицу: колонки «угол», «хук», «формат», «имя файла», «дата запуска», «результат». Это и рабочий инструмент, и артефакт портфолио.",
"<b>Статика:</b> Canva в бесплатной версии. Сделать один шаблон 1080×1350 с местом под заголовок, подзаголовок и логотип. Дальше меняется только текст и фон — 15 минут на вариант.",
"<b>Видео:</b> CapCut, бесплатен. Вертикаль 9:16, длина 15–30 секунд. Первые 3 секунды — хук, дальше суть, в конце призыв.",
"<b>Субтитры обязательны.</b> В CapCut они генерируются автоматически из речи, остаётся поправить ошибки. Без них видео для значительной части аудитории немое.",
"<b>Исходники для UGC:</b> снимает сам клиент или его мастер на телефон по твоему сценарию. Для теста идеальное качество не нужно, нужна живость.",
"Именовать файлы по системе: <code>fridge_pain_ugc_01</code>, <code>fridge_price_static_03</code>. Иначе через месяц невозможно понять, что сработало."
]},
{t:"p", x:"Про сценарий для клиента: не присылай ему просьбу «снять что-нибудь». Присылай текст на 4–5 строк с указанием, что говорить и что показывать. Тогда получишь материал с первого раза, а не после пяти переписок."},

{t:"h", x:"Шаг 4. Тестирование"},
{t:"term", en:"Creative testing", ru:"тестирование креативов", d:"Систематическое сравнение вариантов внутри одной группы объявлений. В эпоху Andromeda отдельные группы под каждый креатив не создают: система сама распределяет показы внутри общего пула."},
{t:"steps", title:"Как читать результат", items:[
"Смотреть на уровне объявлений: <b>Ads Manager → вкладка Ads</b>, не на уровне кампаний.",
"Настроить колонки: <b>Columns → Customise columns</b> → добавить CTR, CPM, частоту, стоимость результата.",
"Дать креативу накопить хотя бы 1000–2000 показов, прежде чем судить. По 200 показам выводы не делают.",
"Сравнивать креативы между собой по стоимости результата, а не по CTR: красивый CTR при дорогой заявке ничего не стоит.",
"Выигравший угол размножать: если «цена и прозрачность» работает, сделать ещё три варианта этого угла в разных форматах.",
"Проигравший угол не чинить бесконечно: два-три варианта не сработали — угол не попадает в эту аудиторию, иди к следующему."
]},
{t:"term", en:"Creative fatigue", ru:"выгорание креатива", d:"Падение эффективности от того, что аудитория видела материал слишком много раз. Признаки: рост частоты, рост CPM, падение CTR при неизменных настройках."},
{t:"ex", title:"Ритм, который спрашивают на собеседовании", body:[
"Рабочий темп для небольшого аккаунта — <b>3–5 новых креативов в неделю</b>, добавляемых в ту же группу.",
"Старые не удаляют, а отключают, когда они перестают получать показы. История обучения при этом сохраняется.",
"Вопрос «как вы боретесь с выгоранием» звучит почти на каждом интервью. Ответ про конкретный ритм и таблицу производства работает несравнимо лучше, чем рассуждения про важность креатива."
]}

{
id:"m6", num:6, title:"Email-маркетинг и автоматизация", subtitle:"Списки, сегменты, флоу, тексты", duration:"5 дней", pass:80,
intro:"Единственный канал, где аудитория принадлежит бизнесу, а не платформе. Здесь нет аукциона и нет алгоритма, который завтра поменяет правила. Модуль практический: к концу ты умеешь развернуть полный набор автоматизаций в чистом аккаунте за один рабочий день.",
lessons:[

{ id:"m6l1", title:"Как устроен канал", blocks:[
{t:"p", x:"В рекламе ты арендуешь внимание: перестал платить — трафик кончился. В email ты владеешь списком контактов, и отправка стоит копейки. Поэтому в зрелых бизнесах email обычно даёт лучшую экономику, чем платные каналы, — но только если его кто-то ведёт."},
{t:"f", x:"Реклама приводит человека один раз. Email работает с ним годами", note:"Поэтому email-специалист нужен там, где уже есть поток новых контактов"},

{t:"h", x:"Базовые понятия"},
{t:"term", en:"ESP — email service provider", ru:"платформа рассылок", d:"Сервис, через который отправляются письма: Klaviyo, HubSpot, Mailchimp, Braze, Salesforce Marketing Cloud. Отвечает за отправку, шаблоны, сегментацию и автоматизации."},
{t:"term", en:"List", ru:"список", d:"Статичный набор контактов. Человек попадает в него один раз и остаётся, пока его не удалят вручную или он не отпишется."},
{t:"term", en:"Segment", ru:"сегмент", d:"Динамическая выборка по условиям: купившие за 90 дней, открывавшие письма за 30 дней, из конкретного города. Состав пересчитывается автоматически. Основной рабочий инструмент — списками почти не пользуются."},
{t:"term", en:"Campaign", ru:"разовая рассылка", d:"Письмо, отправленное один раз выбранному сегменту: акция, новость, анонс. Ты сам решаешь, кому и когда."},
{t:"term", en:"Flow / Automation", ru:"автоматическая цепочка", d:"Последовательность писем, запускаемая событием: подписался, бросил корзину, купил, перестал открывать. Настраивается один раз и работает без тебя. Именно здесь живёт основная часть выручки канала."},
{t:"warn", x:"Соотношение, которое надо понимать: разовые рассылки дают объём, флоу дают выручку. В зрелом e-commerce автоматические цепочки обычно приносят непропорционально много денег относительно доли отправленных писем, потому что срабатывают в момент интереса."},

{t:"h", x:"Два типа проектов"},
{t:"tab", head:["","E-commerce","B2B и услуги"], rows:[
["Типичный ESP","Klaviyo, Omnisend","HubSpot, ActiveCampaign, Salesforce"],
["Главные флоу","Welcome, брошенная корзина, брошенный просмотр, post-purchase, win-back","Welcome, nurture, реактивация, цепочка после демо"],
["Что считается успехом","Выручка с письма, доля выручки канала","Лиды, переходы в SQL, влияние на сделки"],
["Цикл","Дни","Недели и месяцы"],
["Содержание","Товары, скидки, напоминания","Польза, кейсы, разбор проблемы"]
]},

{t:"h", x:"Метрики"},
{t:"tab", head:["Метрика","Что показывает","Осторожно"], rows:[
["Delivery rate","Доля писем, принятых сервером","Принято ≠ попало во входящие"],
["Open rate","Доля открытий","Сильно завышен из-за защиты приватности Apple: часть открытий фиксируется без участия человека"],
["CTR","Доля кликнувших от доставленных","Более честный показатель интереса, чем открытия"],
["CTOR","Доля кликнувших от открывших","Оценивает содержание письма отдельно от темы"],
["Conversion rate","Доля дошедших до целевого действия","Главный показатель"],
["Revenue per recipient","Выручка на получателя","Основной KPI в e-commerce"],
["Unsubscribe rate","Доля отписавшихся","Выше 0,5% на рассылку — сигнал проблемы"],
["Spam complaint rate","Доля жалоб","Критично: подробно в следующем модуле"]
]},
{t:"warn", x:"Open rate перестал быть надёжной метрикой после введения защиты приватности в почте Apple: часть открытий засчитывается автоматически, без участия человека. Ориентироваться на него как на главный KPI в 2026 — признак того, что специалист давно не обновлял знания. Смотрят на клики и конверсии."},

{t:"h", x:"Где практиковаться бесплатно"},
{t:"p", x:"Важная практическая деталь, на которой спотыкаются новички: не во всех бесплатных тарифах доступны автоматизации."},
{t:"tab", head:["Инструмент","Что доступно бесплатно","Для чего использовать"], rows:[
["Klaviyo","Полноценные флоу, сегменты, шаблоны на небольшом числе контактов","Главная площадка для практики: автоматизации работают целиком"],
["HubSpot","CRM, формы, базовая рассылка. Полноценные workflows — платный уровень","Понять логику CRM, lifecycle-стадий и связки с продажами"],
["Mailchimp","Базовая отправка и простые автоматизации","Запасной вариант"]
]},
{t:"ex", title:"Что делать по ходу модуля", body:[
"Завести бесплатный аккаунт Klaviyo и собрать в нём <b>полный набор флоу на тестовом магазине или просто на выдуманном бренде</b>. Контакты — ты сам и пара своих адресов.",
"Это четвёртый артефакт портфолио: скриншоты настроенных цепочек с условиями и письмами показывают больше, чем любой сертификат.",
"Отдельно завести бесплатный HubSpot, чтобы понимать язык B2B: lifecycle stage, lead status, связку формы с контактом. На собеседовании в B2B спросят именно про это."
]}

 {t:"ESP перестали его считать", why:"Считают, просто доверять ему как раньше нельзя."},

{t:"h", x:"Навигация"},
{t:"path", label:"Левое меню Klaviyo", x:"Dashboards · Campaigns · Flows · Audience (Lists & Segments, Profiles) · Content (Templates, Images) · Analytics · Settings"},
{t:"p", x:"Интерфейсы ESP перестраивают чаще, чем рекламные кабинеты, поэтому названия разделов могут немного отличаться. Логика при этом одинакова во всех платформах: контакты, сегменты, шаблоны, разовые рассылки, автоматизации, аналитика. Если ориентируешься в одной, в соседней разберёшься за день."},

{t:"h", x:"Шаг 1. Домен отправителя"},
{t:"warn", x:"Это первое, что делают в новом аккаунте, и первое, что пропускают новички. Отправка с общего домена платформы работает, но доставляемость будет посредственной, а при росте объёма начнутся проблемы. Подробности механики — в следующем модуле, здесь важно сделать это сразу."},
{t:"steps", title:"Настройка своего домена", items:[

"Нажать добавление домена, ввести свой домен вида <code>mail.kestrelsupply.com</code> — обычно используют поддомен, а не основной домен.",
"Платформа выдаст несколько DNS-записей типа CNAME. Их нужно добавить в настройки домена у регистратора или хостера.",
"Добавить записи, вернуться в Klaviyo и нажать проверку. Обновление DNS занимает от нескольких минут до суток.",
"Дождаться статуса подтверждения по всем записям. До этого момента массовую отправку не начинают."
]},

{t:"h", x:"Шаг 2. Сбор контактов"},
{t:"term", en:"Sign-up form", ru:"форма подписки", d:"Встроенная форма на сайте: всплывающая, встроенная в страницу или закреплённая внизу. Собирает контакты в указанный список."},
{t:"term", en:"Double opt-in", ru:"подтверждение подписки", d:"Человеку приходит письмо со ссылкой подтверждения, и только после клика он попадает в базу. Контактов получается меньше, но они живые — это заметно улучшает доставляемость и снижает жалобы."},
{t:"steps", title:"Создать форму", items:[
"<b>Audience</b> → <b>Sign-up forms</b> → создать новую.",
"Выбрать тип: popup, flyout или embed. Для магазина обычно popup с задержкой или по намерению уйти со страницы.",
"В настройках указать, в какой список попадают подписчики.",
"Задать оффер: «−10% на первый заказ» работает лучше, чем «подпишитесь на новости». Человеку нужна причина.",
"Собирать на первом шаге только email. Имя и прочее — вторым шагом или позже.",
"Включить double opt-in в настройках списка, если планируется серьёзный объём."

{t:"warn", x:"Отправлять на всю базу подряд — главная причина падения доставляемости. Чем дольше человек не реагирует, тем сильнее его неоткрытия портят репутацию отправителя. Регулярные рассылки идут по активным сегментам, а не по всему списку."},

{
id:"m7", num:7, title:"Deliverability: чтобы письма доходили", subtitle:"Аутентификация, репутация, гигиена базы", duration:"2 дня", pass:80,
intro:"Самый недооценённый навык в email-профессии и самый быстрый способ выделиться. Отправить письмо умеет каждый, починить ситуацию «всё уходит в спам» — почти никто. Модуль короткий и целиком практический.",
lessons:[

{ id:"m7l1", title:"Аутентификация домена", blocks:[
{t:"p", x:"Почтовый сервер получателя решает три вопроса по каждому письму: кто его отправил, можно ли этому отправителю доверять и хотят ли получатели такие письма. Первый вопрос закрывается аутентификацией домена, и без неё остальное не имеет значения."},
{t:"f", x:"Аутентификация → репутация → вовлечённость", note:"Каждый уровень работает, только если пройден предыдущий"},

{t:"h", x:"Три записи, которые надо знать"},
{t:"term", en:"SPF — Sender Policy Framework", ru:"список разрешённых отправителей", d:"DNS-запись, перечисляющая серверы, которым разрешено отправлять письма от имени твоего домена. Получатель сверяет, пришло ли письмо с разрешённого сервера."},
{t:"term", en:"DKIM — DomainKeys Identified Mail", ru:"цифровая подпись письма", d:"Криптографическая подпись, которой отправляющий сервер подписывает письмо. Получатель проверяет её открытым ключом из DNS. Подтверждает, что письмо не подменили по дороге."},
{t:"term", en:"DMARC — Domain-based Message Authentication", ru:"политика обработки непрошедших проверку", d:"Запись, говорящая получателю, что делать с письмами, которые не прошли SPF и DKIM: ничего (p=none), в спам (p=quarantine) или отклонить (p=reject). Также включает отчёты."},
{t:"term", en:"Alignment", ru:"согласование доменов", d:"Требование, чтобы домен в видимом адресе отправителя совпадал с доменом, прошедшим SPF или DKIM. Запись может быть настроена, а согласование не выполняться — тогда DMARC всё равно не проходит."},

{t:"h", x:"Что требуют почтовые провайдеры"},
{t:"p", x:"В 2024 году Google и Yahoo ввели обязательные требования к массовым отправителям, позже аналогичные ввёл Microsoft. Это перестало быть рекомендацией."},
{t:"tab", head:["Провайдер","Порог","Что требуется"], rows:[
["Gmail","Более 5 000 писем в день на личные адреса Gmail","SPF, DKIM и DMARC с согласованием, одноклик-отписка. Ниже порога — хотя бы SPF или DKIM"],
["Yahoo","Массовая отправка","DKIM и DMARC с согласованием, SPF, одноклик-отписка"],
["Microsoft","Более 5 000 писем в день на Outlook.com, Hotmail, Live.com","SPF и DKIM должны проходить, DMARC минимум p=none с согласованием по SPF или DKIM"]
]},
{t:"term", en:"Spam complaint rate", ru:"доля жалоб на спам", d:"Доля получателей, нажавших «это спам». Gmail требует удерживать её ниже 0,1% по данным Postmaster Tools и не допускать достижения 0,3% и выше. Yahoo в своих рекомендациях называет порог ниже 0,3%."},
{t:"warn", x:"0,1% — это одна жалоба на тысячу писем. Порог кажется мягким, пока не посчитаешь: на рассылке в 20 000 писем двадцать нажатий «спам» уже выводят тебя к границе. Поэтому отправка на неактивные сегменты так опасна."},
{t:"term", en:"One-click unsubscribe", ru:"отписка в один клик", d:"Техническая возможность отписаться прямо из интерфейса почты, без перехода на сайт. Реализуется специальным заголовком письма. Для массовых отправителей обязательна, и отписку нужно обрабатывать быстро."},
{t:"p", x:"Хорошая новость: если ты отправляешь через нормальный ESP и настроил свой домен, одноклик-отписка и часть заголовков настраиваются платформой автоматически. Твоя зона — DNS-записи и качество базы."},

{t:"h", x:"Как это настроить"},
{t:"steps", title:"Проверка и настройка аутентификации", items:[
"<b>Проверить текущее состояние.</b> Открыть <b>MXToolbox</b> (mxtoolbox.com), в разделе проверок ввести домен и посмотреть SPF, DKIM и DMARC. Бесплатно и за минуту.",
"<b>SPF.</b> Должна быть ровно одна запись типа TXT. Две записи SPF на домене — частая ошибка, при которой проверка не проходит вообще. Если ESP даёт свою запись, её объединяют с существующей, а не добавляют второй строкой.",
"<b>DKIM.</b> Записи выдаёт ESP при настройке домена отправителя. Обычно это CNAME, которые просто добавляются у регистратора.",
"<b>DMARC.</b> Создаётся запись TXT на поддомене <code>_dmarc.твойдомен</code>. Начинают с мягкой политики <code>v=DMARC1; p=none; rua=mailto:отчёты@твойдомен</code> — она ничего не блокирует, но присылает отчёты.",
"<b>Пожить на p=none две-три недели,</b> изучить отчёты: видно, кто ещё отправляет письма от твоего домена и всё ли настроено.",
"<b>Ужесточить политику</b> до <code>p=quarantine</code>, а затем до <code>p=reject</code>, когда убедился, что легитимная почта проходит проверку.",
"<b>Проверить итог</b> ещё раз через MXToolbox и отправкой тестового письма на свой Gmail: в меню письма есть пункт показа оригинала, где видны результаты SPF, DKIM и DMARC."
]},
{t:"warn", x:"Сразу ставить p=reject — классическая ошибка новичка. Если какая-то система компании отправляет письма от этого домена и не настроена, её почта просто перестанет доходить. Политику всегда ужесточают поэтапно."},
{t:"path", label:"Проверка письма в Gmail", x:"Открыть письмо → меню с тремя точками → Show original → смотреть строки SPF, DKIM, DMARC"}
], quiz:[
{id:"q700", type:"single", q:"Что делает SPF?", options:[
 {t:"Перечисляет серверы, которым разрешено отправлять письма от имени домена", ok:true, why:"Получатель сверяет, пришло ли письмо с разрешённого сервера."},
 {t:"Подписывает письмо криптографически", why:"Это DKIM."},
 {t:"Указывает, что делать с непрошедшими проверку письмами", why:"Это DMARC."},
 {t:"Шифрует содержимое письма", why:"Ни одна из трёх записей содержимое не шифрует."}
], explain:"SPF — список разрешённых отправителей, DKIM — подпись, DMARC — политика."},
{id:"q701", type:"single", q:"Что произойдёт, если на домене две записи SPF?", options:[
 {t:"Проверка не пройдёт вообще", ok:true, why:"Частая ошибка: записи нужно объединять в одну, а не добавлять второй строкой."},
 {t:"Сработает та, что добавлена позже", why:"Не сработает ни одна."},
 {t:"Сработают обе", why:"Стандарт допускает только одну запись."},
 {t:"Ничего, это нормально", why:"Это прямая причина проблем с доставляемостью."}
], explain:"Если ESP даёт свою запись SPF, её объединяют с существующей."},
{id:"q702", type:"single", q:"С какой политики DMARC начинают?", options:[
 {t:"p=none — ничего не блокирует, но присылает отчёты", ok:true, why:"Позволяет увидеть, кто ещё шлёт письма от домена."},
 {t:"p=reject сразу, для максимальной защиты", why:"Легитимная почта ненастроенных систем перестанет доходить."},
 {t:"p=quarantine сразу", why:"Тоже рано: сначала надо посмотреть отчёты."},
 {t:"DMARC не нужен, хватает SPF и DKIM", why:"Для массовых отправителей DMARC обязателен."}
], explain:"Путь всегда один: none → quarantine → reject, с паузой на изучение отчётов."},
{id:"q703", type:"num", q:"Какую долю жалоб на спам требует удерживать Gmail? Укажи в процентах.", unit:"%", answer:0.1, tol:0.01, hint:"Очень маленькое число, меньше одной десятой процента.", explain:"Ниже 0,1% по данным Postmaster Tools, и нельзя допускать достижения 0,3% и выше."},
{id:"q704", type:"num", q:"При доле жалоб 0,1% сколько жалоб допустимо на рассылку в 20 000 писем?", unit:"жалоб", answer:20, tol:0.5, hint:"Одна жалоба на тысячу писем.", explain:"20 000 × 0,001 = 20 жалоб. Порог кажется мягким, пока не посчитаешь в абсолютных числах."},
{id:"q705", type:"single", q:"Что такое alignment и почему он важен?", options:[
 {t:"Совпадение видимого домена отправителя с доменом, прошедшим SPF или DKIM; без него DMARC не проходит", ok:true, why:"Записи могут быть настроены, а согласование не выполняться."},
 {t:"Выравнивание текста в шаблоне письма", why:"К вёрстке отношения не имеет."},
 {t:"Синхронизация времени отправки", why:"Не связано."},
 {t:"Совпадение темы и содержания", why:"Не связано."}
], explain:"Частая ситуация: SPF и DKIM зелёные, а DMARC красный — почти всегда дело в согласовании."},
{id:"q706", type:"single", q:"Чем быстро проверить SPF, DKIM и DMARC домена?", options:[
 {t:"MXToolbox: ввести домен и посмотреть все три записи", ok:true, why:"Бесплатно и занимает минуту."},
 {t:"Google Ads → Admin", why:"Там настройки рекламного аккаунта."},
 {t:"GA4 DebugView", why:"Там события сайта."},
 {t:"Meta Events Manager", why:"Там пиксель и CAPI."}
], explain:"Второй способ — отправить письмо себе на Gmail и открыть показ оригинала."},
{id:"q707", type:"tf", q:"Верно ли: требования Google, Yahoo и Microsoft к массовым отправителям — это рекомендации, которые можно не выполнять.", answer:false, explain:"Это обязательные требования. Microsoft прямо указывает, что несоответствующие письма от крупных отправителей могут отклоняться с ошибкой аутентификации."}
]},

{ id:"m7l2", title:"Репутация, гигиена базы и диагностика", blocks:[
{t:"p", x:"Аутентификация отвечает на вопрос «кто ты». Репутация отвечает на вопрос «стоит ли тебя пускать». Она складывается из того, как получатели реагируют на твои письма, и это единственная часть, которой ты управляешь содержанием работы, а не настройками DNS."},

{t:"h", x:"Из чего складывается репутация"},
{t:"tab", head:["Фактор","Влияние","Чем управлять"], rows:[

["Возвраты на несуществующие адреса","Сильный негативный","Гигиена базы, double opt-in"],
["Открытия и клики","Основной позитивный сигнал","Релевантность содержания"],
["Попадание в спам-ловушки","Критический","Чистка базы, отказ от покупных списков"],
["Стабильность объёмов","Умеренное","Прогрев, отсутствие резких скачков"],

{t:"term", en:"Bounce", ru:"возврат", d:"Письмо, не доставленное сервером. Hard bounce — адрес не существует, такие контакты удаляются сразу. Soft bounce — временная причина вроде переполненного ящика, повторяют несколько раз и потом исключают."},
{t:"term", en:"Suppression list", ru:"список исключений", d:"Контакты, которым платформа больше не отправляет: отписавшиеся, пожаловавшиеся, с жёсткими возвратами. Ведётся автоматически, но при переносе базы в новый ESP его обязательно переносят вручную."},
{t:"term", en:"Spam trap", ru:"спам-ловушка", d:"Адрес, созданный или заброшенный специально для отлова недобросовестных отправителей. Письмо на такой адрес — прямой удар по репутации. Главный источник — покупные базы и адреса, не очищавшиеся годами."},
{t:"warn", x:"Покупные базы не просто неэффективны — они содержат спам-ловушки и гарантированно убивают репутацию домена. Восстановление занимает месяцы. Если клиент предлагает «у нас есть база, давайте разошлём» — это момент, когда надо сказать нет и объяснить почему."},

{t:"h", x:"Прогрев"},
{t:"term", en:"Warm-up", ru:"прогрев домена", d:"Постепенное наращивание объёмов отправки с нового домена или адреса. Провайдеры не доверяют отправителю без истории, и резкий старт с большого объёма воспринимается как спам-атака."},
{t:"steps", title:"Схема прогрева нового домена", items:[
"Первая неделя: отправлять только самому активному сегменту, маленькими объёмами. Цель — собрать положительные сигналы.",
"Увеличивать объём постепенно, примерно вдвое раз в несколько дней, наблюдая за показателями.",
"Следить за долей жалоб и возвратов на каждом шаге. Выросли — остановить рост объёма и разобраться.",
"Полный выход на плановые объёмы занимает от двух до четырёх недель в зависимости от размера базы.",
"Не менять домен отправителя без необходимости: каждая смена означает прогрев заново."
]},

{t:"h", x:"Гигиена базы"},
{t:"steps", title:"Регулярная чистка", items:[
"<b>Раз в месяц:</b> удалять контакты с жёсткими возвратами, если платформа этого не делает автоматически.",
"<b>Раз в квартал:</b> выделять сегмент без активности 180+ дней и запускать по нему реактивационную цепочку из двух-трёх писем.",
"<b>После реактивации:</b> не откликнувшихся исключать из регулярных рассылок. Полностью удалять не обязательно, достаточно перестать им писать.",

"<b>Никогда</b> не импортировать базу, происхождение которой неизвестно."
]},
{t:"ex", title:"Почему удалять контакты не страшно", body:[
"Типичное возражение клиента: «мы платим за базу в 50 000 человек, зачем её сокращать».",
"Ответ в цифрах: если активны 12 000, то отправка на остальные 38 000 даёт нулевую выручку и при этом портит репутацию, из-за чего письма хуже доходят до тех самых активных 12 000.",
"То есть мёртвая часть базы не просто бесполезна — она <b>снижает результат по живой части</b>. Плюс тариф ESP обычно считается по числу контактов, так что чистка ещё и экономит деньги.",
"Эта логика, объяснённая спокойно и с цифрами конкретного аккаунта, обычно снимает возражение за одну встречу."
]},

{t:"h", x:"Диагностика: письма уходят в спам"},

"<b>Доля жалоб.</b> Выше 0,1% — ищи причину в сегментации и частоте. Выше 0,3% — срочная ситуация.",
"<b>Состав получателей.</b> Отправлялось на всю базу или на активный сегмент? Отправка на всю базу — самая частая причина.",
